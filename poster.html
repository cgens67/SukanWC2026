<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Apple-Style Graphic Organiser Builder</title>
  <style>
    /* ========================================================
       SF PRO DISPLAY LOCAL FONTS (fonts/otf/)
       ======================================================== */
    @font-face {
      font-family: 'SF Pro Display';
      src: url('fonts/otf/sf_pro_display_regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro Display';
      src: url('fonts/otf/sf_pro_display_medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro Display';
      src: url('fonts/otf/sf_pro_display_semibold.otf') format('opentype');
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro Display';
      src: url('fonts/otf/sf_pro_display_bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'SF Pro Display';
      src: url('fonts/otf/sf_pro_display_heavy.otf') format('opentype');
      font-weight: 800;
      font-style: normal;
    }

    :root[data-theme="light"] {
      --bg-primary: #F2F2F7;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-solid: #FFFFFF;
      --fill-tertiary: rgba(118, 118, 128, 0.12);
      --separator: rgba(60, 60, 67, 0.16);
      --label-primary: #1C1C1E;
      --label-secondary: rgba(60, 60, 67, 0.65);
      --badge-bg: rgba(118, 118, 128, 0.08);

      --ios-blue: #007AFF;
      --ios-blue-bg: rgba(0, 122, 255, 0.08);
      --ios-blue-border: rgba(0, 122, 255, 0.25);
      --ios-red: #FF3B30;
      --ios-mint: #00C7BE;
      --ios-purple: #AF52DE;
      --ios-orange: #FF9500;
      --slider-fill: #007AFF;
      --canvas-bg: #F5F5F7;
    }

    :root[data-theme="dark"] {
      --bg-primary: #000000;
      --card-bg: rgba(28, 28, 30, 0.85);
      --card-solid: #1C1C1E;
      --fill-tertiary: rgba(118, 118, 128, 0.24);
      --separator: rgba(84, 84, 88, 0.36);
      --label-primary: #FFFFFF;
      --label-secondary: rgba(235, 235, 245, 0.65);
      --badge-bg: rgba(255, 255, 255, 0.08);

      --ios-blue: #0A84FF;
      --ios-blue-bg: rgba(10, 132, 255, 0.12);
      --ios-blue-border: rgba(10, 132, 255, 0.3);
      --ios-red: #FF453A;
      --ios-mint: #63E6E2;
      --ios-purple: #BF5AF2;
      --ios-orange: #FF9F0A;
      --slider-fill: #0A84FF;
      --canvas-bg: #0A0A0C;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }

    body, button, input, textarea, select { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-primary); color: var(--label-primary);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 40px; transition: background-color 0.25s ease, color 0.25s ease; overflow-x: hidden;
    }

    .animate-content-size {
      transition: max-height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  padding 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
                  margin 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .animate-pop-in {
      opacity: 0;
      animation: popInItem 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes popInItem {
      0% { opacity: 0; transform: translateY(10px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top Bar */
    .top-bar { width: 100%; max-width: 1260px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .app-title-group h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.6px; }
    .app-title-group p { font-size: 13px; font-weight: 500; color: var(--label-secondary); margin-top: 2px; }
    .top-actions { display: flex; gap: 8px; }

    .nav-icon-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 0.5px solid var(--separator);
      background: var(--card-solid); color: var(--label-primary); display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.06); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s ease;
    }
    .nav-icon-btn:active { transform: scale(0.92); }
    .nav-icon-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
    .nav-icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    @media (max-width: 768px) {
      .top-bar { flex-direction: column; align-items: flex-start; gap: 16px; }
      .app-title-group h1 { font-size: 24px; }
      .top-actions { width: 100%; display: flex; flex-wrap: wrap; gap: 10px; }
    }

    /* Segmented Control */
    .segmented-control {
      position: relative; background-color: var(--fill-tertiary); border-radius: 12px; display: flex; padding: 3px;
      width: 100%; max-width: 1260px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .segment-indicator {
      position: absolute; top: 3px; bottom: 3px; left: 0; width: 0; background: var(--card-solid); border-radius: 9px;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.06);
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), width 0.28s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1; pointer-events: none;
    }
    .segment-btn {
      flex: 1; border: none; background: transparent; padding: 9px 12px; font-size: 14px; font-weight: 500; min-width: 90px;
      color: var(--label-primary); cursor: pointer; position: relative; z-index: 2; transition: font-weight 0.2s ease, opacity 0.2s ease;
      white-space: nowrap; text-align: center;
    }
    .segment-btn.active { font-weight: 700; }

    /* Toast Notification */
    .toast-pill {
      position: fixed; bottom: 24px; background: var(--card-solid); color: var(--label-primary); border: 0.5px solid var(--separator);
      border-radius: 100px; padding: 10px 20px; font-size: 13.5px; font-weight: 700; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      display: flex; align-items: center; gap: 8px; z-index: 1000; opacity: 0; transform: translateY(20px);
      transition: opacity 0.25s, transform 0.25s; pointer-events: none;
    }
    .toast-pill.show { opacity: 1; transform: translateY(0); }

    /* Dashboard Layout */
    .dashboard-layout { width: 100%; max-width: 1260px; display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
    @media (min-width: 990px) { .dashboard-layout { grid-template-columns: 1.35fr 0.65fr; } }

    /* Canvas Stage Container */
    .canvas-card {
      background: var(--card-bg); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 0.5px solid var(--separator); border-radius: 30px; padding: 20px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.05); position: relative; min-height: 580px;
    }
    .canvas-wrapper {
      position: relative; width: 100%; max-width: 720px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center;
      background: var(--canvas-bg); border-radius: 26px; border: 1px solid var(--separator); box-shadow: 0 18px 44px rgba(0, 0, 0, 0.09);
      overflow: hidden;
    }
    #posterCanvas {
      width: 100%; height: 100%; display: block; border-radius: 24px;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: auto;
    }

    /* Side Panel */
    .side-panel { display: flex; flex-direction: column; gap: 16px; }
    .panel-card {
      background: var(--card-bg); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 0.5px solid var(--separator); border-radius: 22px; padding: 18px; box-shadow: 0 12px 30px rgba(0,0,0,0.03);
    }
    .badge-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .count-pill {
      background: var(--badge-bg); padding: 5px 12px; border-radius: 100px; font-size: 13px;
      font-weight: 600; color: var(--label-secondary); display: inline-flex; align-items: center; gap: 6px;
    }
    .count-indicator-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--ios-blue); }

    /* Buttons */
    .btn {
      appearance: none; border: none; font-size: 15px; font-weight: 600; border-radius: 14px; padding: 13px 16px;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease, background-color 0.25s ease;
    }
    .btn:active { transform: scale(0.96); opacity: 0.88; }
    .btn-primary { background-color: var(--ios-blue); color: #FFFFFF; font-size: 17px; font-weight: 700; box-shadow: 0 6px 18px rgba(0, 122, 255, 0.35); padding: 14px 18px; }
    .btn-secondary { background-color: var(--fill-tertiary); color: var(--label-primary); }
    .btn-compact { padding: 9px 12px; font-size: 13px; border-radius: 11px; gap: 6px; }
    .btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

    /* Form Fields */
    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--label-secondary); letter-spacing: 0.3px; }
    .text-input {
      width: 100%; border: 1px solid var(--separator); background: var(--fill-tertiary); border-radius: 12px;
      padding: 10px 14px; font-size: 14px; font-weight: 600; color: var(--label-primary); outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .text-input:focus { border-color: var(--ios-blue); background: var(--card-solid); }

    /* Scale Pill Switcher */
    .scale-btn-group { display: flex; gap: 6px; margin-top: 4px; }
    .scale-btn {
      flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--separator); background: var(--fill-tertiary);
      font-size: 13px; font-weight: 700; color: var(--label-primary); cursor: pointer; transition: all 0.15s ease;
    }
    .scale-btn.active { background: var(--ios-blue); color: #FFFFFF; border-color: var(--ios-blue); }

    /* Clean Blank Rows Editor */
    .blank-row-item {
      display: flex; gap: 8px; align-items: center; margin-bottom: 8px;
      background: var(--fill-tertiary); padding: 8px 10px; border-radius: 12px;
    }
    .blank-prefix-input { width: 50px; text-align: center; font-weight: 700; padding: 8px 4px; border-radius: 8px; border: 1px solid var(--separator); background: var(--card-solid); color: var(--label-primary); outline: none; }
    .blank-answer-input { flex: 1; padding: 8px 10px; font-size: 13.5px; border-radius: 8px; border: 1px solid var(--separator); background: var(--card-solid); color: var(--label-primary); outline: none; }
    
    .btn-icon-del {
      background: transparent; border: none; color: var(--ios-red); cursor: pointer; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; transition: transform 0.15s ease;
    }
    .btn-icon-del:active { transform: scale(0.85); }
    .btn-icon-del svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }

    /* Modals & Sheets */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      z-index: 500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; padding: 20px;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      background: var(--card-solid); width: 100%; max-width: 490px; border-radius: 22px; padding: 20px; display: flex; flex-direction: column;
      transform: scale(0.92); box-shadow: 0 20px 48px rgba(0, 0, 0, 0.25); transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 85vh; overflow-y: auto;
    }
    .modal-backdrop.open .modal-sheet { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .modal-header button { background: none; border: none; font-size: 16px; color: var(--ios-blue); cursor: pointer; }
    .modal-header button.bold { font-weight: 700; }

    /* Fullscreen Mode */
    body.is-fullscreen { padding: 0; margin: 0; height: 100vh; overflow: hidden; justify-content: center; }
    body.is-fullscreen .top-bar, body.is-fullscreen .segmented-control, body.is-fullscreen .side-panel { display: none !important; }
    body.is-fullscreen .dashboard-layout { width: 100vw; height: 100vh; max-width: none; display: flex; align-items: center; justify-content: center; }
    body.is-fullscreen .canvas-card { width: 100vw; height: 100vh; max-width: none; border-radius: 0; border: none; padding: 12px; justify-content: center; }
    body.is-fullscreen .canvas-wrapper { width: min(92vh, 92vw); height: min(92vh, 92vw); max-width: none; margin: 0; }
    .fs-exit-floating { display: none; position: fixed; top: 18px; right: 18px; z-index: 1000; }
    body.is-fullscreen .fs-exit-floating { display: flex; }
  </style>
</head>
<body>

  <!-- Floating Toast Notification -->
  <div class="toast-pill" id="toastPill">Resolution updated</div>

  <!-- Floating Exit Button for Fullscreen -->
  <button class="nav-icon-btn fs-exit-floating" onclick="exitFullscreenMode()" title="Exit Fullscreen">
    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </button>

  <!-- Top Bar Navigation -->
  <div class="top-bar">
    <div class="app-title-group">
      <h1>mind map poster builder</h1>
      <p>Clean Apple Bento Layout • Comprehension Text Sync • Resizable Scale</p>
    </div>
    <div class="top-actions">
      <!-- Undo / Redo Buttons -->
      <button class="nav-icon-btn" id="undoNavBtn" onclick="undo()" disabled title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
      </button>
      <button class="nav-icon-btn" id="redoNavBtn" onclick="redo()" disabled title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
      </button>

      <!-- Reset Template -->
      <button class="nav-icon-btn" onclick="resetToDefaultData()" title="Reset to Initial Layout">
        <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      </button>

      <!-- Fullscreen Toggle Button -->
      <button class="nav-icon-btn" id="fsToggleBtn" onclick="toggleFullscreenMode()" title="Fullscreen / Keynote Mode">
        <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
      </button>

      <!-- Theme Switcher -->
      <button class="nav-icon-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle UI Light/Dark Theme">
        <svg id="themeIconSun" style="display:none;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </div>

  <!-- Segmented Tabs for Editing Specific Nodes or Resolution -->
  <div class="segmented-control" id="segmentedControl" role="tablist">
    <div class="segment-indicator" id="segmentIndicator"></div>
    <button class="segment-btn active" data-node="canvasConfig" onclick="switchActiveNodeTab('canvasConfig')">Size & Theme</button>
    <button class="segment-btn" data-node="center" onclick="switchActiveNodeTab('center')">Center Device</button>
    <button class="segment-btn" data-node="top" onclick="switchActiveNodeTab('top')">Purpose (17)</button>
    <button class="segment-btn" data-node="right" onclick="switchActiveNodeTab('right')">Functions (18-20)</button>
    <button class="segment-btn" data-node="bottom" onclick="switchActiveNodeTab('bottom')">Weight (21)</button>
    <button class="segment-btn" data-node="left" onclick="switchActiveNodeTab('left')">Modern Era (22-24)</button>
  </div>

  <!-- Main Grid Dashboard -->
  <div class="dashboard-layout animate-content-size">
    
    <!-- Left Column: Canvas Poster Preview Stage -->
    <div class="canvas-card animate-content-size">
      <div class="canvas-wrapper">
        <canvas id="posterCanvas" width="2400" height="2400"></canvas>
      </div>
    </div>

    <!-- Right Column: Interactive Editor Side Panel -->
    <div class="side-panel animate-content-size">
      
      <!-- Primary Action Card with Resolution & Size Controls -->
      <div class="panel-card animate-content-size">
        <div class="badge-bar">
          <div class="count-pill">
            <span class="count-indicator-dot"></span>
            <span id="currentResBadge">2400 × 2400 (Retina 2K)</span>
          </div>
          <span style="font-size: 11px; font-weight: 800; color: var(--ios-blue); letter-spacing: 0.5px;">APPLE HIG SPEC</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Resolution Selector -->
          <div class="field-group" style="margin-bottom: 2px;">
            <label class="field-label">Export Canvas Resolution</label>
            <select class="text-input" id="resolutionSelect" onchange="setPosterResolution(this.value)" style="cursor: pointer; font-weight: 700;">
              <option value="1200">1200 × 1200 • Standard HD</option>
              <option value="2400" selected>2400 × 2400 • Retina 2K (Super Crisp)</option>
              <option value="3840">3840 × 3840 • 4K UHD Master (Razor Sharp)</option>
              <option value="4800">4800 × 4800 • 300 DPI Ultra Print</option>
            </select>
          </div>

          <!-- Direct Design Size Selector -->
          <div class="field-group" style="margin-bottom: 4px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label class="field-label" style="margin: 0;">Diagram Scale (Make Design Large)</label>
              <span id="scaleValLabel" style="font-size: 12px; font-weight: 800; color: var(--ios-blue);">1.25x</span>
            </div>
            <div class="scale-btn-group">
              <button class="scale-btn" onclick="setDiagramScale(1.0)">Normal</button>
              <button class="scale-btn active" onclick="setDiagramScale(1.25)">Large</button>
              <button class="scale-btn" onclick="setDiagramScale(1.4)">Huge</button>
            </div>
            <input type="range" id="scaleSlider" min="0.9" max="1.5" step="0.05" value="1.25" 
                   oninput="setDiagramScale(parseFloat(this.value))" 
                   style="width: 100%; margin-top: 8px; accent-color: var(--ios-blue); cursor: pointer;" />
          </div>

          <button class="btn btn-primary" onclick="exportHighResPoster()">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Export Poster (PNG)
          </button>
          
          <button class="btn btn-secondary btn-compact" onclick="printPoster()">
            <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            AirPrint / Save as PDF
          </button>
        </div>
      </div>

      <!-- Node Dynamic Editor Card -->
      <div class="panel-card animate-content-size" id="nodeEditorCard">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
          <h3 id="activeNodeHeading" style="font-size: 16px; font-weight: 700;">Canvas Configuration</h3>
          <button class="btn btn-secondary btn-compact" onclick="openBulkJsonModal()" style="font-size: 11px; padding: 4px 8px;">JSON</button>
        </div>

        <div id="dynamicEditorFields"></div>
      </div>

    </div>
  </div>

  <!-- JSON Bulk Import / Export Modal -->
  <div class="modal-backdrop" id="jsonModal" onclick="closeBulkJsonModal(event)">
    <div class="modal-sheet animate-content-size" onclick="event.stopPropagation()">
      <div class="modal-header">
        <button onclick="closeBulkJsonModal()">Cancel</button>
        <h2>Poster Specification (JSON)</h2>
        <button class="bold" onclick="applyJsonData()">Apply</button>
      </div>
      <p style="font-size: 13px; color: var(--label-secondary); margin-bottom: 10px;">
        Export or update all question numbers, answers, tags, and design tokens directly.
      </p>
      <textarea id="jsonModalTextarea" style="width: 100%; height: 260px; border-radius: 12px; border: 1px solid var(--separator); padding: 12px; font-size: 13px; font-family: monospace; background: var(--bg-primary); color: inherit; resize: none; outline: none; user-select: text;"></textarea>
    </div>
  </div>

  <script>
    /* ========================================================
       CLEAN APPLE HIG POSTER SPECIFICATION (EXAM TEXT SYNC)
       ======================================================== */
    const DEFAULT_POSTER_DATA = {
      posterTheme: "lightKeynote",
      diagramScale: 1.25,
      center: {
        tag: "Core topic",
        title: "Mobile phones",
        subtitle: ""
      },
      top: {
        tag: "Purpose",
        title: "Purpose",
        blanks: [

        cardInnerCellBg: "rgba(255, 255, 255, 0.045)",

        titleText: "#F5F5F7",
        bodyText: "#F5F5F7",
        secondaryText: "#F5F5F7",

        pills: {

    /* Web Audio Feedback */
    let audioCtx = null;
    function playClickSound(strength = 0.5) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(560 + 200 * strength, t);
        osc.frequency.exponentialRampToValueAtTime(160, t + 0.026);
        gain.gain.setValueAtTime(0.04 * strength, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.026);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.026);
      } catch (e) {}
    }

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById("toastPill");
      toast.textContent = msg;
      toast.classList.add("show");

      toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
    }

    /* Undo / Redo */
    function pushStateSnapshot(desc = "") {
      undoStack.push(JSON.parse(JSON.stringify(posterData)));
      if (undoStack.length > 40) undoStack.shift();
      redoStack.length = 0;
      syncButtons();
      saveAppState();
    }

    function undo() {
      if (undoStack.length === 0) return;
      redoStack.push(JSON.parse(JSON.stringify(posterData)));
      posterData = undoStack.pop();
      saveAppState();
      renderPoster();
      renderEditor();
      syncButtons();
      playClickSound(0.4);
      showToast("Undone");
    }

    function redo() {
      if (redoStack.length === 0) return;
      undoStack.push(JSON.parse(JSON.stringify(posterData)));
      posterData = redoStack.pop();
      saveAppState();
      renderPoster();
      renderEditor();
      syncButtons();
      playClickSound(0.4);
      showToast("Redone");
    }

    function syncButtons() {
      document.getElementById("undoNavBtn").disabled = undoStack.length === 0;
      document.getElementById("redoNavBtn").disabled = redoStack.length === 0;
    }

    function saveAppState() {
      try {
        localStorage.setItem("apple_poster_data_v7", JSON.stringify(posterData));
      } catch (e) {}
    }

    function resetToDefaultData() {
      pushStateSnapshot("Reset Template");
      posterData = JSON.parse(JSON.stringify(DEFAULT_POSTER_DATA));
      saveAppState();
      renderPoster();
      renderEditor();

    /* ========================================================
       PROPORTIONAL BENTO CANVAS RENDERER
       ======================================================== */
    const canvas = document.getElementById("posterCanvas");
    const ctx = canvas.getContext("2d");

    function drawAppleSquircle(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.arcTo(x + width, y, x + width, y + radius, radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.arcTo(x + width, y + height, x + width - radius, y + height, radius);
      ctx.lineTo(x + radius, y + height);
      ctx.arcTo(x, y + height, x, y + height - radius, radius);
      ctx.lineTo(x, y + radius);
      ctx.arcTo(x, y, x + radius, y, radius);
      ctx.closePath();
    }

    function setPosterResolution(resValue) {
      currentResolution = parseInt(resValue, 10);
      canvas.width = currentResolution;
      canvas.height = currentResolution;
      
      const badgeMap = {
        1200: "1200 × 1200 (Standard HD)",
        2400: "2400 × 2400 (Retina 2K)",
        3840: "3840 × 3840 (4K UHD Master)",
        4800: "4800 × 4800 (300 DPI Print)"
      };
      document.getElementById("currentResBadge").textContent = badgeMap[currentResolution] || `${currentResolution} × ${currentResolution}`;
      
      renderPoster();
      playClickSound(0.4);
      showToast(`✓ Buffer updated: ${badgeMap[currentResolution]}`);
    }

    function setDiagramScale(newScale) {
      pushStateSnapshot("Change Design Scale");
      posterData.diagramScale = Math.round(newScale * 100) / 100;
      document.getElementById("scaleValLabel").textContent = `${posterData.diagramScale.toFixed(2)}x`;
      document.getElementById("scaleSlider").value = posterData.diagramScale;

      document.querySelectorAll(".scale-btn").forEach(btn => {
        const val = parseFloat(btn.textContent.replace('x', ''));
        btn.classList.toggle("active", Math.abs(val - posterData.diagramScale) < 0.06);
      });

      saveAppState();
      renderPoster();
      playClickSound(0.25);
    }

    function renderPoster() {
      const W = canvas.width;
      const H = canvas.height;
      const scale = W / 2000;
      
      ctx.save();
      ctx.scale(scale, scale);
      
      const t = APPLE_THEMES[posterData.posterTheme] || APPLE_THEMES.lightKeynote;
      const ds = posterData.diagramScale || 1.25;

      // 1. Studio Canvas Background
      ctx.fillStyle = t.canvasBg;
      ctx.fillRect(0, 0, 2000, 2000);

      // Subtle Outer Framing Border
      ctx.strokeStyle = t.outerBorder;
      ctx.lineWidth = 2.5;
      drawAppleSquircle(ctx, 35, 35, 1930, 1930, 42);
      ctx.stroke();

      const cx = 1000;
      const cy = 1000;

      // Center Hub dimensions scaled by ds
      const cW = Math.round(440 * ds);
      const cH = Math.round(360 * ds);
      const cX = cx - cW / 2;
      const cY = cy - cH / 2;

      // Card widths scaled by ds
      const topW = Math.round(520 * ds);
      const botW = Math.round(520 * ds);
      const leftW = Math.round(480 * ds);
      const rightW = Math.round(480 * ds);

      // Helper to compute snug card dimensions for sentence-cased answers
      function computeSnugCard(nodeKey) {
        const data = posterData[nodeKey];
        const blanks = data ? data.blanks || [] : [];
        const headerH = Math.round(105 * ds);
        const itemH = Math.round(58 * ds); // compact, snug single-line height
        const itemGap = Math.round(10 * ds);
        const bottomPad = Math.round(18 * ds);

        const cardH = headerH + blanks.length * itemH + Math.max(0, blanks.length - 1) * itemGap + bottomPad;
        return { cardH, itemH, itemGap, headerH };
      }

      const topDims = computeSnugCard("top");
      const botDims = computeSnugCard("bottom");
      const leftDims = computeSnugCard("left");
      const rightDims = computeSnugCard("right");

      // Adaptive symmetrical connector distance
      const vertGap = Math.round(95 * (1.7 - ds * 0.45));
      const topX = cx - topW / 2;
      const topY = cY - vertGap - topDims.cardH;

      const botX = cx - botW / 2;
      const botY = cY + cH + vertGap;

      const horizGap = Math.round(70 * (1.6 - ds * 0.45));
      const leftX = cX - horizGap - leftW;
      const leftY = cy - leftDims.cardH / 2;

      const rightX = cX + cW + horizGap;
      const rightY = cy - rightDims.cardH / 2;

      // 2. High-Impact Connector Lines
      function drawAppleConnector(fromX, fromY, toX, toY, color) {
        ctx.save();
        ctx.strokeStyle = t.lineColor;
        ctx.lineWidth = 3.8;
        ctx.lineCap = "round";

        ctx.beginPath();
        const midX = (fromX + toX) / 2;
        const midY = (fromY + toY) / 2;
        ctx.moveTo(fromX, fromY);
        ctx.bezierCurveTo(midX, fromY, midX, toY, toX, toY);
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(fromX, fromY, 6.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(toX, toY, 6.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      drawAppleConnector(cx, cY, cx, topY + topDims.cardH, t.pills.top.accent);
      drawAppleConnector(cx, cY + cH, cx, botY, t.pills.bottom.accent);
      drawAppleConnector(cX, cy, leftX + leftW, cy, t.pills.left.accent);
      drawAppleConnector(cX + cW, cy, rightX, cy, t.pills.right.accent);

      // 3. Render Bento Cards with Snug, Zero-Waste Answer Cells
      function drawSnugAppleCard(nodeKey, x, y, width, dims, pillConfig) {
        const data = posterData[nodeKey];
        if (!data) return;

        const height = dims.cardH;

        ctx.save();
        ctx.shadowColor = t.cardShadow;
        ctx.shadowBlur = Math.round(38 * ds);
        ctx.shadowOffsetY = Math.round(14 * ds);
        drawAppleSquircle(ctx, x, y, width, height, Math.round(34 * ds));
        ctx.fillStyle = t.cardFill;
        ctx.fill();
        ctx.restore();

        // Hairline Card Border
        ctx.lineWidth = 2;
        ctx.strokeStyle = t.cardBorder;
        drawAppleSquircle(ctx, x, y, width, height, Math.round(34 * ds));
        ctx.stroke();

        // Category Tag Badge (Sentence cased)
        const tagText = data.tag || "";
        if (tagText) {
          ctx.font = `700 ${14 * ds}px 'SF Pro Display', sans-serif`;
          const tagW = ctx.measureText(tagText).width + Math.round(24 * ds);
          drawAppleSquircle(ctx, x + Math.round(26 * ds), y + Math.round(22 * ds), tagW, Math.round(28 * ds), Math.round(8 * ds));
          ctx.fillStyle = pillConfig.bg;
          ctx.fill();
          ctx.fillStyle = pillConfig.text;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(tagText, x + Math.round(26 * ds) + tagW / 2, y + Math.round(36 * ds));
        }

        // Section Title (Sentence cased)
        ctx.font = `800 ${28 * ds}px 'SF Pro Display', sans-serif`;
        ctx.fillStyle = t.titleText;
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText(data.title, x + Math.round(26 * ds), y + Math.round(58 * ds));

        // Render Inset Answer Cells (Snug, single-row height, zero vertical gaps)
        const blanks = data.blanks || [];
        let curY = y + dims.headerH;
        const cellX = x + Math.round(20 * ds);
        const cellW = width - Math.round(40 * ds);

        blanks.forEach((b) => {
          const itemH = dims.itemH;

          // Inset Pill Background
          drawAppleSquircle(ctx, cellX, curY, cellW, itemH, Math.round(16 * ds));
          ctx.fillStyle = t.cardInnerCellBg;
          ctx.fill();
          ctx.lineWidth = 1;
          ctx.strokeStyle = t.cardInnerCellBorder;
          ctx.stroke();

          // Circular Number Badge
          const badgeX = cellX + Math.round(26 * ds);
          const badgeY = curY + itemH / 2;
          const badgeR = Math.round(17 * ds);
          ctx.beginPath();
          ctx.arc(badgeX, badgeY, badgeR, 0, Math.PI * 2);
          ctx.fillStyle = pillConfig.bg;
          ctx.fill();

          ctx.font = `800 ${16 * ds}px 'SF Pro Display', sans-serif`;
          ctx.fillStyle = pillConfig.text;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(b.num, badgeX, badgeY);

          // Sentence-cased Answer Text
          const contentX = cellX + Math.round(56 * ds);
          ctx.font = `600 ${18.5 * ds}px 'SF Pro Display', sans-serif`;
          ctx.fillStyle = t.secondaryText;
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(b.answer || "", contentX, badgeY);

          curY += itemH + dims.itemGap;
        });
      }

      // Draw all 4 satellite cards
      drawSnugAppleCard("top", topX, topY, topW, topDims, t.pills.top);
      drawSnugAppleCard("bottom", botX, botY, botW, botDims, t.pills.bottom);
      drawSnugAppleCard("left", leftX, leftY, leftW, leftDims, t.pills.left);
      drawSnugAppleCard("right", rightX, rightY, rightW, rightDims, t.pills.right);

      // 4. Central Hub Device (Hero Card)
      ctx.save();
      ctx.shadowColor = t.cardShadow;
      ctx.shadowBlur = Math.round(44 * ds);
      ctx.shadowOffsetY = Math.round(16 * ds);
      drawAppleSquircle(ctx, cX, cY, cW, cH, Math.round(40 * ds));
      ctx.fillStyle = t.cardFill;
      ctx.fill();
      ctx.restore();

      ctx.lineWidth = 2.5;
      ctx.strokeStyle = t.cardBorder;
      drawAppleSquircle(ctx, cX, cY, cW, cH, Math.round(40 * ds));
      ctx.stroke();

      // Top Dynamic Island Pill
      drawAppleSquircle(ctx, cx - Math.round(46 * ds), cY + Math.round(24 * ds), Math.round(92 * ds), Math.round(10 * ds), Math.round(5 * ds));
      ctx.fillStyle = t.lineColor;
      ctx.fill();

      // Core Topic Tag Pill
      const cTag = posterData.center.tag || "Core topic";
      ctx.font = `700 ${14 * ds}px 'SF Pro Display', sans-serif`;
      const cTagW = ctx.measureText(cTag).width + Math.round(26 * ds);
      drawAppleSquircle(ctx, cx - cTagW / 2, cY + Math.round(56 * ds), cTagW, Math.round(26 * ds), Math.round(7 * ds));
      ctx.fillStyle = t.pills.center.bg;
      ctx.fill();
      ctx.fillStyle = t.pills.center.text;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cTag, cx, cY + Math.round(69 * ds));

      // Device Glyph
      ctx.strokeStyle = t.pills.center.accent;
      ctx.lineWidth = 3.2;
      drawAppleSquircle(ctx, cx - Math.round(20 * ds), cY + Math.round(102 * ds), Math.round(40 * ds), Math.round(64 * ds), Math.round(9 * ds));
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cY + Math.round(154 * ds), 3, 0, Math.PI * 2);
      ctx.fillStyle = t.pills.center.accent;
      ctx.fill();

      // Core Title (Sentence cased)
      ctx.font = `800 ${44 * ds}px 'SF Pro Display', sans-serif`;
      ctx.fillStyle = t.titleText;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(posterData.center.title, cx, cY + Math.round(222 * ds));

      ctx.restore();
    }

    /* ========================================================
       SIDE PANEL & TAB CONTROLLER
       ======================================================== */
    function switchActiveNodeTab(tabKey) {
      activeTab = tabKey;
      updateIndicator();
      renderEditor();

      const activeBtn = document.querySelector(`.segment-btn[data-node="${activeTab}"]`);

        document.querySelectorAll(".segment-btn").forEach(btn => btn.classList.remove("active"));
        activeBtn.classList.add("active");
        indicator.style.width = `${activeBtn.offsetWidth}px`;
        indicator.style.transform = `translateX(${activeBtn.offsetLeft}px)`;
      }
    }

    function renderEditor() {

            <label class="field-label">Topic Title</label>
            <input type="text" class="text-input" value="${posterData.center.title}" oninput="updateCenterTitle(this.value)" />
          </div>
          <div class="field-group">
            <label class="field-label">Pill Tag</label>
            <input type="text" class="text-input" value="${posterData.center.tag || ''}" oninput="updateCenterTag(this.value)" />
          </div>
        `;
      } else {
        const node = posterData[activeTab];
        heading.textContent = `${activeTab.toUpperCase()} Section (${node.title})`;

        let blanksHtml = (node.blanks || []).map((b, idx) => `
          <div class="blank-row-item animate-pop-in">
            <input type="text" class="blank-prefix-input" value="${b.num}" oninput="updateBlankField('${activeTab}', ${idx}, 'num', this.value)" title="Number label" />
            <input type="text" class="blank-answer-input" placeholder="Answer..." value="${b.answer || ''}" oninput="updateBlankField('${activeTab}', ${idx}, 'answer', this.value)" />
            <button class="btn-icon-del" onclick="removeBlankRow('${activeTab}', ${idx})" title="Remove item">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        `).join("");

        container.innerHTML = `
          <div class="field-group">
            <label class="field-label">Card Heading</label>
            <input type="text" class="text-input" value="${node.title}" oninput="updateOuterTitle('${activeTab}', this.value)" />
          </div>
          <div class="field-group">
            <label class="field-label">Pill Category Tag</label>
            <input type="text" class="text-input" value="${node.tag || ''}" oninput="updateOuterTag('${activeTab}', this.value)" />
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin: 12px 0 8px;">
            <label class="field-label" style="margin: 0;">Specification Items (${node.blanks.length})</label>
            <button class="btn btn-secondary btn-compact" style="font-size: 11px; padding: 4px 8px;" onclick="addBlankRow('${activeTab}')">+ Add Item</button>
          </div>
          <div>${blanksHtml}</div>
        `;
      }
    }

    /* Mutation handlers */
    function setPosterTheme(theme) {
      pushStateSnapshot("Change Poster Theme");
      posterData.posterTheme = theme;
      saveAppState();
      renderPoster();
      playClickSound(0.3);
    }

    function updateCenterTitle(val) {
      posterData.center.title = val;
      renderPoster();
      saveAppState();
    }

    function updateCenterTag(val) {
      posterData.center.tag = val;
      renderPoster();
      saveAppState();
    }

    function updateOuterTitle(nodeKey, val) {
      posterData[nodeKey].title = val;
      renderPoster();
      saveAppState();
    }

    function updateOuterTag(nodeKey, val) {
      posterData[nodeKey].tag = val;
      renderPoster();
      saveAppState();
    }

    function updateBlankField(nodeKey, index, key, val) {
      if (!posterData[nodeKey].blanks[index]) return;
      posterData[nodeKey].blanks[index][key] = val;
      renderPoster();
      saveAppState();
    }

    function addBlankRow(nodeKey) {
      pushStateSnapshot("Add Blank Item");
      const list = posterData[nodeKey].blanks;
      const lastNum = list.length > 0 ? (parseInt(list[list.length - 1].num) + 1 || '') : "1";
      list.push({ num: `${lastNum}`, answer: "Answer" });
      saveAppState();
      renderPoster();
      renderEditor();
      playClickSound(0.3);
    }

    function removeBlankRow(nodeKey, index) {
      pushStateSnapshot("Remove Item");
      posterData[nodeKey].blanks.splice(index, 1);
      saveAppState();
      renderPoster();
      renderEditor();
      playClickSound(0.2);
    }

    /* ========================================================
       EXPORT & PRINT ENGINE
       ======================================================== */
    function exportHighResPoster() {
      playClickSound(0.5);
      const link = document.createElement("a");
      link.download = `Apple-Spec-${(posterData.center.title || 'MindMap').replace(/\s+/g, '_')}-${currentResolution}p.png`;
      link.href = canvas.toDataURL("image/png", 1.0);
      link.click();
      showToast(`✓ Exported ${currentResolution}×${currentResolution} PNG!`);
    }

    function printPoster() {
      const dataUrl = canvas.toDataURL("image/png", 1.0);
      const printWindow = window.open('', '_blank');
      if (printWindow) {
        printWindow.document.write(`
          <html>
            <head>
              <title>${posterData.center.title} - Apple Specification</title>
              <style>
                @page { size: auto; margin: 8mm; }
                body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; background: #FFF; }
                img { max-width: 96vw; max-height: 96vh; object-fit: contain; }
              </style>
            </head>
            <body>
              <img src="${dataUrl}" onload="window.print(); window.close();" />
            </body>
          </html>
        `);
        printWindow.document.close();
      }
    }

    /* JSON Modal */
    function openBulkJsonModal() {
      document.getElementById("jsonModalTextarea").value = JSON.stringify(posterData, null, 2);
      document.getElementById("jsonModal").classList.add("open");
    }
    function closeBulkJsonModal(e) {
      if (e && e.target !== e.currentTarget && e.currentTarget.id !== 'jsonModal') return;
      document.getElementById("jsonModal").classList.remove("open");
    }
    function applyJsonData() {
      try {
        const parsed = JSON.parse(document.getElementById("jsonModalTextarea").value.trim());
        pushStateSnapshot("JSON Import");
        posterData = parsed;
        saveAppState();
        renderPoster();
        renderEditor();
        closeBulkJsonModal();
        playClickSound(0.5);
        showToast("✓ JSON Applied!");
      } catch (err) {
        alert("Invalid JSON: " + err.message);
      }
    }

    /* Fullscreen & Theme */
    function toggleFullscreenMode() { document.body.classList.contains("is-fullscreen") ? exitFullscreenMode() : enterFullscreenMode(); }
    function enterFullscreenMode() { document.body.classList.add("is-fullscreen"); const el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen().catch(() => {}); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }
    function exitFullscreenMode() { document.body.classList.remove("is-fullscreen"); if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (document.webkitExitFullscreen && document.webkitFullscreenElement) document.webkitExitFullscreen(); }
    document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) document.body.classList.remove("is-fullscreen"); });

    function toggleTheme() {
      const root = document.documentElement;
      const isDark = root.getAttribute("data-theme") === "dark";
      const newTheme = isDark ? "light" : "dark";
      root.setAttribute("data-theme", newTheme);
      document.getElementById("themeIconSun").style.display = newTheme === "dark" ? "block" : "none";
      document.getElementById("themeIconMoon").style.display = newTheme === "dark" ? "none" : "block";
      playClickSound(0.2);
    }

    /* Keyboard Shortcuts */
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
      const modifier = (navigator.platform.toUpperCase().indexOf('MAC') >= 0) ? e.metaKey : e.ctrlKey;
      if (modifier && !e.shiftKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
      else if ((modifier && e.shiftKey && e.key.toLowerCase() === 'z') || (modifier && e.key.toLowerCase() === 'y')) { e.preventDefault(); redo(); }
    });

    window.addEventListener("resize", () => { updateIndicator(); });

    // Ensure fonts are ready before initial canvas rendering
    if (document.fonts) {
      document.fonts.ready.then(() => {
        renderPoster();
        renderEditor();
        updateIndicator();
      });
    } else {
      renderPoster();
      renderEditor();
      updateIndicator();
    }
  </script>
</body>
</html>
