<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f7f5" id="meta-theme-color">
    <title>Site Directory — Choose Destination</title>

    <!-- Material Symbols Rounded -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,-50..200&display=block" />

    <style>
        :root {
            /* Default: Light + Emerald */
            --md-surface: #f4f7f5;
            --md-surface-container-lowest: #ffffff;
            --md-surface-container-low: #f8fbf9;
            --md-surface-container: #edf2ef;
            --md-surface-container-high: #e2e9e4;
            --md-surface-container-highest: #d7e0da;

            --md-on-surface: #181d1a;
            --md-on-surface-variant: #4f5b54;
            --md-outline: #79867e;
            --md-outline-variant: #c4cec8;
            --md-pane-border: rgba(196, 206, 200, 0.55);

            --md-primary: #0b875b;
            --md-primary-hover: #086f4b;
            --md-on-primary: #ffffff;
            --md-primary-container: #bff4dc;
            --md-on-primary-container: #003824;

            --md-secondary-container: #dbeafe;
            --md-on-secondary-container: #172554;

            --md-inverse-surface: #242b27;
            --md-inverse-on-surface: #f4f7f5;

            /* M3 Expressive Motion Tokens */
            --m3-spring-spatial-fast: cubic-bezier(0.38, 1.4, 0.42, 1);
            --m3-spring-spatial: cubic-bezier(0.34, 1.45, 0.36, 1);
            --m3-emphasized-decelerate: cubic-bezier(0.05, 0.7, 0.1, 1);
            --m3-emphasized-accelerate: cubic-bezier(0.3, 0, 0.8, 0.15);
            --m3-shape-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --m3-effects-standard: cubic-bezier(0.2, 0, 0, 1);

            /* M3 Elevation */
            --m3-shadow-1: 0 1px 3px rgba(16, 24, 20, 0.06), 0 1px 2px rgba(16, 24, 20, 0.04);
            --m3-shadow-2: 0 6px 20px -4px rgba(16, 24, 20, 0.08), 0 2px 6px -1px rgba(16, 24, 20, 0.04);
            --m3-shadow-3: 0 14px 36px -6px rgba(16, 24, 20, 0.16), 0 4px 12px -2px rgba(16, 24, 20, 0.08);
        }

        /* --- M3 Color Accents (Light) --- */
        :root[data-accent="ocean"] {
            --md-surface: #f3f6fc;
            --md-surface-container-low: #f7f9fe;
            --md-surface-container: #ebeef6;
            --md-surface-container-high: #e1e6f0;
            --md-surface-container-highest: #d5dce9;
            --md-on-surface: #181c23;
            --md-on-surface-variant: #4c5566;
            --md-outline-variant: #c4cad8;
            --md-pane-border: rgba(196, 202, 216, 0.55);

            --md-primary: #1d5fe6;
            --md-primary-hover: #154cc2;
            --md-primary-container: #d8e4ff;
            --md-on-primary-container: #001a4d;
        }

        :root[data-accent="violet"] {
            --md-surface: #f7f4fc;
            --md-surface-container-low: #faf8fe;
            --md-surface-container: #f0ecf7;
            --md-surface-container-high: #e6e0f0;
            --md-surface-container-highest: #dbd3e9;
            --md-on-surface: #1d1924;
            --md-on-surface-variant: #564e64;
            --md-outline-variant: #ccc4d8;
            --md-pane-border: rgba(204, 196, 216, 0.55);

            --md-primary: #6d4aff;
            --md-primary-hover: #5634e6;
            --md-primary-container: #e6deff;
            --md-on-primary-container: #21005d;
        }

        :root[data-accent="rose"] {
            --md-surface: #fcf4f6;
            --md-surface-container-low: #fef8f9;
            --md-surface-container: #f7ecf0;
            --md-surface-container-high: #f0e1e6;
            --md-surface-container-highest: #e7d4db;
            --md-on-surface: #23181c;
            --md-on-surface-variant: #634d54;
            --md-outline-variant: #d8c3ca;
            --md-pane-border: rgba(216, 195, 202, 0.55);

            --md-primary: #c83264;
            --md-primary-hover: #a7234f;
            --md-primary-container: #ffd9e2;
            --md-on-primary-container: #3e0019;
        }

        :root[data-accent="amber"] {
            --md-surface: #fbf6f1;
            --md-surface-container-low: #fefaf6;
            --md-surface-container: #f5ede5;
            --md-surface-container-high: #ece1d6;
            --md-surface-container-highest: #e2d4c7;
            --md-on-surface: #221b15;
            --md-on-surface-variant: #615346;
            --md-outline-variant: #d6c8ba;
            --md-pane-border: rgba(214, 200, 186, 0.55);

            --md-primary: #b85d00;
            --md-primary-hover: #964b00;
            --md-primary-container: #ffdfc2;
            --md-on-primary-container: #381800;
        }

        /* --- Dark Mode Base & Tonal Accents --- */
        :root[data-theme="dark"] {
            --md-surface: #0f1411;
            --md-surface-container-lowest: #161c18;
            --md-surface-container-low: #1a211d;
            --md-surface-container: #202823;
            --md-surface-container-high: #29322c;
            --md-surface-container-highest: #333e37;

            --md-on-surface: #e4ebe6;
            --md-on-surface-variant: #a8b5ad;
            --md-outline: #79867e;
            --md-outline-variant: #3c4740;
            --md-pane-border: rgba(255, 255, 255, 0.08);

            --md-primary: #4ade9e;
            --md-primary-hover: #6ee7b7;
            --md-on-primary: #003822;
            --md-primary-container: #0a5237;
            --md-on-primary-container: #bff4dc;

            --md-inverse-surface: #e4ebe6;
            --md-inverse-on-surface: #181d1a;

            --m3-shadow-1: 0 1px 3px rgba(0, 0, 0, 0.28), 0 1px 2px rgba(0, 0, 0, 0.2);
            --m3-shadow-2: 0 8px 24px -4px rgba(0, 0, 0, 0.36), 0 2px 8px -1px rgba(0, 0, 0, 0.24);
            --m3-shadow-3: 0 18px 40px -6px rgba(0, 0, 0, 0.52), 0 6px 14px -2px rgba(0, 0, 0, 0.34);
        }

        :root[data-theme="dark"][data-accent="ocean"] {
            --md-surface: #0f131a;
            --md-surface-container-lowest: #161b24;
            --md-surface-container-low: #1a202b;
            --md-surface-container: #212835;
            --md-surface-container-high: #2a3342;
            --md-surface-container-highest: #343e50;
            --md-on-surface: #e3e8f2;
            --md-on-surface-variant: #a6b1c4;
            --md-outline-variant: #3b4559;

            --md-primary: #7aa7ff;
            --md-primary-hover: #9ec0ff;
            --md-on-primary: #002366;
            --md-primary-container: #183d8a;
            --md-on-primary-container: #d8e4ff;
            --md-inverse-surface: #e3e8f2;
        }

        :root[data-theme="dark"][data-accent="violet"] {
            --md-surface: #13111a;
            --md-surface-container-lowest: #1a1724;
            --md-surface-container-low: #1f1c2b;
            --md-surface-container: #262235;
            --md-surface-container-high: #302b42;
            --md-surface-container-highest: #3b3550;
            --md-on-surface: #eae5f4;
            --md-on-surface-variant: #b3abc4;
            --md-outline-variant: #443d59;

            --md-primary: #b5a0ff;
            --md-primary-hover: #cabaff;
            --md-on-primary: #29007a;
            --md-primary-container: #4527a0;
            --md-on-primary-container: #e6deff;
            --md-inverse-surface: #eae5f4;
        }

        :root[data-theme="dark"][data-accent="rose"] {
            --md-surface: #181114;
            --md-surface-container-lowest: #20171b;
            --md-surface-container-low: #261b20;
            --md-surface-container: #2e2127;
            --md-surface-container-high: #392a31;
            --md-surface-container-highest: #45333c;
            --md-on-surface: #f3e4e9;
            --md-on-surface-variant: #c2aab2;
            --md-outline-variant: #533e47;

            --md-primary: #ff80a8;
            --md-primary-hover: #ffa6c2;
            --md-on-primary: #4d001e;
            --md-primary-container: #7c173b;
            --md-on-primary-container: #ffd9e2;
            --md-inverse-surface: #f3e4e9;
        }

        :root[data-theme="dark"][data-accent="amber"] {
            --md-surface: #16120e;
            --md-surface-container-lowest: #1e1813;
            --md-surface-container-low: #241d17;
            --md-surface-container: #2c231c;
            --md-surface-container-high: #362c23;
            --md-surface-container-highest: #42362b;
            --md-on-surface: #f0e6dc;
            --md-on-surface-variant: #bfb0a1;
            --md-outline-variant: #4f4134;

            --md-primary: #ffb76b;
            --md-primary-hover: #ffc991;
            --md-on-primary: #452100;
            --md-primary-container: #703900;
            --md-on-primary-container: #ffdfc2;
            --md-inverse-surface: #f0e6dc;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        button:focus:not(:focus-visible),
        label:focus:not(:focus-visible) {
            outline: none;
        }

        button:focus-visible {
            outline: 2px solid var(--md-primary);
            outline-offset: 3px;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--md-surface);
            color: var(--md-on-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            padding: 18px 20px calc(28px + env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s var(--m3-effects-standard), color 0.25s var(--m3-effects-standard);
        }

        /* --- Material Symbols --- */
        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            width: 1em;
            height: 1em;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            -webkit-font-smoothing: antialiased;
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            user-select: none;
            flex-shrink: 0;
        }

        /* --- M3 Expressive Pointer Ripple --- */
        .m3-ripple {
            position: relative;
            touch-action: manipulation;
        }

        .m3-ripple > :not(.m3-ripple-layer):not(input) {
            position: relative;
            z-index: 1;
        }

        .m3-ripple-layer {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .m3-ripple-wave {
            position: absolute;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.16;
            transform: scale(0);
            pointer-events: none;
            animation: m3RippleAnim 520ms var(--m3-effects-standard) forwards;
        }

        @keyframes m3RippleAnim {
            0% { transform: scale(0); opacity: 0.2; }
            60% { opacity: 0.12; }
            100% { transform: scale(2.6); opacity: 0; }
        }

        /* --- Top App Bar --- */
        .app-top-bar {
            width: 100%;
            max-width: 960px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--md-surface-container-low);
            border: 1px solid var(--md-pane-border);
            padding: 8px 16px 8px 10px;
            border-radius: 24px;
            box-shadow: var(--m3-shadow-1);
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 12px;
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-name {
            font-weight: 750;
            font-size: 0.96rem;
            letter-spacing: -0.02em;
            color: var(--md-on-surface);
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* M3 Filter Chip (Instant Redirect Toggle) */
        .m3-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 14px;
            min-height: 40px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transform: scale(1);
            border: 1px solid var(--md-outline-variant);
            background: var(--md-surface-container-lowest);
            color: var(--md-on-surface-variant);
            box-shadow: var(--m3-shadow-1);
            transition:
                background-color 0.24s var(--m3-effects-standard),
                color 0.24s var(--m3-effects-standard),
                border-color 0.24s var(--m3-effects-standard),
                border-radius 0.3s var(--m3-shape-ease),
                padding 0.28s var(--m3-shape-ease),
                transform 0.26s var(--m3-spring-spatial-fast);
        }

        .m3-chip input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            margin: 0;
            pointer-events: none;
        }

        .m3-chip .chip-check {
            font-size: 16px;
            width: 0;
            margin-right: 0;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.4) rotate(-25deg);
            font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 20;
            transition:
                width 0.3s var(--m3-shape-ease),
                margin-right 0.3s var(--m3-shape-ease),
                opacity 0.2s var(--m3-effects-standard),
                transform 0.34s var(--m3-spring-spatial);
        }

        .m3-chip:has(input:checked) {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border-color: transparent;
            border-radius: 20px;
            padding: 7px 14px 7px 11px;
        }

        .m3-chip:has(input:checked) .chip-check {
            width: 16px;
            margin-right: 6px;
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .m3-chip:active {
            transform: scale(0.93);
            border-radius: 11px;
        }

        .theme-trigger-btn {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            border: none;
            background: var(--md-surface-container-high);
            color: var(--md-on-surface);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--m3-shadow-1);
            transition:
                background-color 0.22s var(--m3-effects-standard),
                color 0.22s var(--m3-effects-standard),
                border-radius 0.3s var(--m3-shape-ease),
                transform 0.28s var(--m3-spring-spatial-fast);
        }

        @media (hover: hover) {
            .theme-trigger-btn:hover {
                background: var(--md-primary-container);
                color: var(--md-on-primary-container);
                border-radius: 20px;
            }
        }
        .theme-trigger-btn:active {
            transform: scale(0.92);
            border-radius: 10px;
        }
        .theme-trigger-btn.is-open {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border-radius: 20px;
        }

        /* --- Main Portal Shell --- */
        .hub-main {
            width: 100%;
            max-width: 960px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 24px;
            padding: 8px 0 16px;
        }

        .hero-header {
            text-align: center;
            padding: 0 8px;
            animation: heroEnter 0.45s var(--m3-spring-spatial) backwards;
        }

        @keyframes heroEnter {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .hero-header h1 {
            margin: 0;
            font-size: clamp(1.65rem, 4vw, 2.35rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--md-on-surface);
        }

        .hero-header p {
            margin: 8px auto 0;
            max-width: 520px;
            font-size: 0.98rem;
            line-height: 1.5;
            color: var(--md-on-surface-variant);
        }

        /* --- Selectable Destination Grid --- */
        .destinations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
            gap: 14px;
            width: 100%;
        }

        .dest-card {
            position: relative;
            text-align: left;
            background: var(--md-surface-container-lowest);
            border: 2px solid var(--md-pane-border);
            border-radius: 24px;
            padding: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 14px;
            color: var(--md-on-surface);
            box-shadow: var(--m3-shadow-1);
            transform: scale(1);
            animation: cardPop 0.48s var(--m3-spring-spatial) backwards;
            transition:
                background-color 0.25s var(--m3-effects-standard),
                border-color 0.25s var(--m3-effects-standard),
                border-radius 0.34s var(--m3-shape-ease),
                transform 0.28s var(--m3-spring-spatial-fast),
                box-shadow 0.25s var(--m3-effects-standard);
        }

        .dest-card:nth-child(1) { animation-delay: 40ms; }
        .dest-card:nth-child(2) { animation-delay: 85ms; }
        .dest-card:nth-child(3) { animation-delay: 130ms; }
        .dest-card:nth-child(4) { animation-delay: 175ms; }
        .dest-card:nth-child(5) { animation-delay: 220ms; }

        @keyframes cardPop {
            from { opacity: 0; transform: translateY(16px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (hover: hover) {
            .dest-card:hover {
                background: var(--md-surface-container-low);
                border-color: var(--md-outline-variant);
                transform: translateY(-2px);
                box-shadow: var(--m3-shadow-2);
            }
        }

        .dest-card:active {
            transform: scale(0.97);
            border-radius: 16px;
        }

        .dest-card.selected {
            background: var(--md-primary-container);
            border-color: var(--md-primary);
            color: var(--md-on-primary-container);
            border-radius: 28px;
            box-shadow: var(--m3-shadow-2);
        }

        .dest-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        .dest-icon-badge {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: var(--md-surface-container);
            color: var(--md-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition:
                background-color 0.25s var(--m3-effects-standard),
                color 0.25s var(--m3-effects-standard),
                border-radius 0.34s var(--m3-shape-ease),
                transform 0.34s var(--m3-spring-spatial);
        }

        .dest-icon-badge .material-symbols-rounded {
            font-size: 24px;
        }

        .dest-card.selected .dest-icon-badge {
            background: var(--md-primary);
            color: var(--md-on-primary);
            border-radius: 23px;
            transform: scale(1.06);
        }

        .dest-check-indicator {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--md-outline-variant);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-primary);
            background: transparent;
            transition:
                background-color 0.22s var(--m3-effects-standard),
                border-color 0.22s var(--m3-effects-standard),
                transform 0.34s var(--m3-spring-spatial);
        }

        .dest-check-indicator .material-symbols-rounded {
            font-size: 16px;
            opacity: 0;
            transform: scale(0.4);
            font-variation-settings: 'FILL' 0, 'wght' 700, 'GRAD' 0, 'opsz' 20;
            transition: opacity 0.2s, transform 0.3s var(--m3-spring-spatial);
        }

        .dest-card.selected .dest-check-indicator {
            background: var(--md-primary);
            border-color: var(--md-primary);
            transform: scale(1.08);
        }

        .dest-card.selected .dest-check-indicator .material-symbols-rounded {
            opacity: 1;
            transform: scale(1);
        }

        .dest-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .dest-title {
            font-size: 1.08rem;
            font-weight: 750;
            letter-spacing: -0.015em;
        }

        .dest-desc {
            font-size: 0.87rem;
            line-height: 1.45;
            color: var(--md-on-surface-variant);
            transition: color 0.25s;
        }

        .dest-card.selected .dest-desc {
            color: var(--md-on-primary-container);
            opacity: 0.86;
        }

        .dest-path {
            margin-top: auto;
            display: inline-flex;
            align-items: center;
            align-self: flex-start;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 10px;
            background: var(--md-surface-container);
            color: var(--md-on-surface-variant);
            transition: background-color 0.25s, color 0.25s;
        }

        .dest-card.selected .dest-path {
            background: rgba(255, 255, 255, 0.35);
            color: var(--md-on-primary-container);
        }

        :root[data-theme="dark"] .dest-card.selected .dest-path {
            background: rgba(0, 0, 0, 0.22);
        }

        /* --- Action Dock (Redirect CTA) --- */
        .action-dock {
            background: var(--md-surface-container-low);
            border: 1px solid var(--md-pane-border);
            border-radius: 28px;
            padding: 12px 14px 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            box-shadow: var(--m3-shadow-2);
            animation: dockEnter 0.5s var(--m3-spring-spatial) 120ms backwards;
        }

        @keyframes dockEnter {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dock-status {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .dock-label {
            font-size: 11.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--md-on-surface-variant);
        }

        .dock-target {
            font-size: 1rem;
            font-weight: 700;
            color: var(--md-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .go-btn {
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: 22px;
            padding: 13px 24px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: var(--m3-shadow-1);
            transform: scale(1);
            transition:
                background-color 0.22s var(--m3-effects-standard),
                border-radius 0.3s var(--m3-shape-ease),
                transform 0.26s var(--m3-spring-spatial-fast),
                box-shadow 0.22s var(--m3-effects-standard),
                opacity 0.2s;
        }

        .go-btn:disabled {
            opacity: 0.48;
            cursor: not-allowed;
            box-shadow: none;
        }

        @media (hover: hover) {
            .go-btn:not(:disabled):hover {
                background: var(--md-primary-hover);
                box-shadow: var(--m3-shadow-2);
                transform: translateY(-1.5px);
            }
            .go-btn:not(:disabled):hover .arrow-icon {
                transform: translateX(3px);
            }
        }

        .go-btn:not(:disabled):active {
            transform: scale(0.94);
            border-radius: 14px;
        }

        .go-btn .arrow-icon {
            transition: transform 0.28s var(--m3-spring-spatial);
        }

        /* --- M3 Expressive Theme Dialog / Mobile Sheet --- */
        .m3-dialog-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 14, 12, 0.48);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 9500;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s var(--m3-effects-standard);
        }

        .m3-dialog-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .m3-dialog {
            background: var(--md-surface-container-low);
            width: 100%;
            max-width: 380px;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid var(--md-pane-border);
            box-shadow: var(--m3-shadow-3);
            transform: scale(0.9) translateY(16px);
            transition: transform 0.34s var(--m3-emphasized-decelerate), background-color 0.25s;
        }

        .m3-dialog-backdrop.open .m3-dialog {
            transform: scale(1) translateY(0);
        }

        .m3-dialog h3 {
            margin: 0 0 16px;
            font-size: 1.2rem;
            color: var(--md-on-surface);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-section-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--md-on-surface-variant);
            margin: 14px 0 8px;
        }
        .theme-section-label:first-of-type { margin-top: 4px; }

        .mode-segmented {
            display: flex;
            gap: 6px;
            background: var(--md-surface-container-high);
            padding: 4px;
            border-radius: 20px;
        }

        .mode-opt-btn {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--md-on-surface-variant);
            padding: 9px 10px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transform: scale(1);
            transition:
                background-color 0.22s var(--m3-effects-standard),
                color 0.22s var(--m3-effects-standard),
                transform 0.24s var(--m3-spring-spatial-fast);
        }
        .mode-opt-btn .material-symbols-rounded { font-size: 17px; }
        .mode-opt-btn:active { transform: scale(0.94); }
        .mode-opt-btn.active {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            box-shadow: var(--m3-shadow-1);
        }

        .swatch-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 6px;
        }

        .swatch-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: transparent;
            border: none;
            padding: 4px 0;
            cursor: pointer;
            color: var(--md-on-surface-variant);
            font-size: 11.5px;
            font-weight: 600;
            transform: scale(1);
            transition: transform 0.24s var(--m3-spring-spatial-fast), color 0.2s;
        }
        .swatch-btn:active { transform: scale(0.92); }
        .swatch-btn.active { color: var(--md-on-surface); font-weight: 700; }

        .swatch-circle {
            width: 44px;
            height: 44px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: var(--m3-shadow-1);
            border: 3px solid transparent;
            transition:
                border-radius 0.34s var(--m3-shape-ease),
                transform 0.34s var(--m3-spring-spatial),
                border-color 0.2s;
        }
        .swatch-circle .material-symbols-rounded {
            font-size: 20px;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.2s, transform 0.32s var(--m3-spring-spatial);
        }
        .swatch-btn.active .swatch-circle {
            border-radius: 14px;
            border-color: var(--md-on-surface);
            transform: scale(1.06);
        }
        .swatch-btn.active .swatch-circle .material-symbols-rounded {
            opacity: 1;
            transform: scale(1);
        }

        .m3-dialog-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .dialog-done-btn {
            background: var(--md-primary);
            color: var(--md-on-primary);
            border: none;
            border-radius: 18px;
            padding: 9px 18px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.24s var(--m3-spring-spatial-fast), border-radius 0.25s;
        }
        .dialog-done-btn:active {
            transform: scale(0.93);
            border-radius: 10px;
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 640px) {
            body {
                padding: 12px 14px calc(20px + env(safe-area-inset-bottom));
            }
            .app-top-bar {
                margin-bottom: 18px;
            }
            .destinations-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .dest-card {
                padding: 15px 16px;
                border-radius: 20px;
                gap: 10px;
            }
            .dest-card.selected {
                border-radius: 24px;
            }
            .action-dock {
                flex-direction: column;
                align-items: stretch;
                padding: 14px;
                border-radius: 24px;
                gap: 12px;
            }
            .dock-status {
                text-align: center;
            }
            .go-btn {
                width: 100%;
                padding: 14px 20px;
            }
            .m3-dialog-backdrop.mobile-sheet {
                align-items: flex-end;
                padding: 0;
            }
            .m3-dialog-backdrop.mobile-sheet .m3-dialog {
                max-width: 100%;
                border-radius: 28px 28px 0 0;
                padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
                transform: translateY(100%);
                transition: transform 0.24s var(--m3-emphasized-accelerate), background-color 0.25s;
            }
            .m3-dialog-backdrop.mobile-sheet.open .m3-dialog {
                transform: translateY(0);
                transition: transform 0.36s var(--m3-emphasized-decelerate), background-color 0.25s;
            }
        }
    </style>
</head>
<body>

    <header class="app-top-bar">
        <div class="brand-pill">
            <span class="brand-icon">
                <span class="material-symbols-rounded">explore</span>
            </span>
            <span class="brand-name">Page Selector</span>
        </div>

        <div class="top-actions">
            <label class="m3-chip m3-ripple" title="Open immediately when you tap a page">
                <input type="checkbox" id="instant-redirect-chk">
                <span class="chip-check material-symbols-rounded">check</span>
                <span>1-Tap Go</span>
            </label>
            <button class="theme-trigger-btn m3-ripple" id="btn-theme" title="Appearance & Color Theme" aria-label="Appearance & Color Theme">
                <span class="material-symbols-rounded">palette</span>
            </button>
        </div>
    </header>

    <main class="hub-main">
        <section class="hero-header">
            <h1>Where would you like to go?</h1>
            <p>Select a destination below to open it, or enable <strong>1-Tap Go</strong> to jump straight in.</p>
        </section>

        <section class="destinations-grid" id="destinations-grid" role="radiogroup" aria-label="Available Pages"></section>

        <footer class="action-dock">
            <div class="dock-status">
                <span class="dock-label">Selected Destination</span>
                <span class="dock-target" id="dock-target">None selected</span>
            </div>
            <button class="go-btn m3-ripple" id="btn-redirect" disabled>
                <span id="btn-redirect-label">Select a page</span>
                <span class="material-symbols-rounded arrow-icon">arrow_forward</span>
            </button>
        </footer>
    </main>

    <!-- M3 Expressive Theme Picker -->
    <div class="m3-dialog-backdrop mobile-sheet" id="theme-modal" role="dialog" aria-modal="true" aria-labelledby="theme-dialog-title">
        <div class="m3-dialog">
            <h3 id="theme-dialog-title">
                <span class="material-symbols-rounded">palette</span>
                <span>Appearance</span>
            </h3>

            <div class="theme-section-label">Theme Mode</div>
            <div class="mode-segmented">
                <button class="mode-opt-btn m3-ripple" data-pick-mode="system">
                    <span class="material-symbols-rounded">brightness_auto</span>
                    <span>Auto</span>
                </button>
                <button class="mode-opt-btn m3-ripple" data-pick-mode="light">
                    <span class="material-symbols-rounded">light_mode</span>
                    <span>Light</span>
                </button>
                <button class="mode-opt-btn m3-ripple" data-pick-mode="dark">
                    <span class="material-symbols-rounded">dark_mode</span>
                    <span>Dark</span>
                </button>
            </div>

            <div class="theme-section-label">M3 Color Theme</div>
            <div class="swatch-grid">
                <button class="swatch-btn" data-pick-accent="emerald">
                    <span class="swatch-circle m3-ripple" style="background: linear-gradient(135deg, #0b875b, #34d399);">
                        <span class="material-symbols-rounded">check</span>
                    </span>
                    <span>Emerald</span>
                </button>
                <button class="swatch-btn" data-pick-accent="ocean">
                    <span class="swatch-circle m3-ripple" style="background: linear-gradient(135deg, #1d5fe6, #60a5fa);">
                        <span class="material-symbols-rounded">check</span>
                    </span>
                    <span>Ocean</span>
                </button>
                <button class="swatch-btn" data-pick-accent="violet">
                    <span class="swatch-circle m3-ripple" style="background: linear-gradient(135deg, #6d4aff, #a78bfa);">
                        <span class="material-symbols-rounded">check</span>
                    </span>
                    <span>Violet</span>
                </button>
                <button class="swatch-btn" data-pick-accent="rose">
                    <span class="swatch-circle m3-ripple" style="background: linear-gradient(135deg, #c83264, #fb7185);">
                        <span class="material-symbols-rounded">check</span>
                    </span>
                    <span>Rose</span>
                </button>
                <button class="swatch-btn" data-pick-accent="amber">
                    <span class="swatch-circle m3-ripple" style="background: linear-gradient(135deg, #b85d00, #fbbf24);">
                        <span class="material-symbols-rounded">check</span>
                    </span>
                    <span>Amber</span>
                </button>
            </div>

            <div class="m3-dialog-actions">
                <button id="btn-theme-done" class="dialog-done-btn m3-ripple">Done</button>
            </div>
        </div>
    </div>

    <script>
        // --- Destinations List ---
        const PAGES = [
            {
                id: 'canvas',
                title: 'Canvas',
                desc: 'Open the Canvas workspace and viewer.',
                path: '/canvas',
                file: 'canvas.html',
                icon: 'brush'
            },
            {
                id: 'markdown',
                title: 'Markdown Reader',
                desc: 'Extract codeblocks, render LaTeX math & export ZIPs.',
                path: '/markdown',
                file: 'markdown.html',
                icon: 'code'
            },
            {
                id: 'poster',
                title: 'Poster Editor',
                desc: 'Create, customize, and export posters.',
                path: '/poster',
                file: 'poster.html',
                icon: 'design_services'
            },
            {
                id: 'school',
                title: 'School',
                desc: 'Access school tools and resources.',
                path: '/school',
                file: 'school.html',
                icon: 'school'
            },
            {
                id: 'sejarah',
                title: 'Sejarah',
                desc: 'Open Sejarah notes and study materials.',
                path: '/sejarah',
                file: 'sejarah.html',
                icon: 'history_edu'
            }
        ];

        // --- Theme System (Shared key with markdown.html) ---
        const THEME_STORAGE_KEY = 'markdown_reader_theme_prefs';
        const INSTANT_KEY = 'portal_instant_redirect';
        let themePrefs = { mode: 'system', accent: 'emerald' };

        try {
            const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
            if (savedTheme) {
                const parsed = JSON.parse(savedTheme);
                if (['system', 'light', 'dark'].includes(parsed.mode)) themePrefs.mode = parsed.mode;
                if (['emerald', 'ocean', 'violet', 'rose', 'amber'].includes(parsed.accent)) themePrefs.accent = parsed.accent;
            }
        } catch (e) {}

        const systemDarkMedia = window.matchMedia('(prefers-color-scheme: dark)');
        const metaThemeColor = document.getElementById('meta-theme-color');

        function applyTheme() {
            const resolved = themePrefs.mode === 'system'
                ? (systemDarkMedia.matches ? 'dark' : 'light')
                : themePrefs.mode;

            document.documentElement.setAttribute('data-theme', resolved);
            document.documentElement.setAttribute('data-accent', themePrefs.accent);

            requestAnimationFrame(() => {
                const surfaceColor = getComputedStyle(document.documentElement).getPropertyValue('--md-surface').trim();
                if (surfaceColor && metaThemeColor) {
                    metaThemeColor.setAttribute('content', surfaceColor);
                }
            });

            document.querySelectorAll('.mode-opt-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.pickMode === themePrefs.mode);
            });
            document.querySelectorAll('.swatch-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.pickAccent === themePrefs.accent);
            });

            localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(themePrefs));
        }

        systemDarkMedia.addEventListener('change', () => {
            if (themePrefs.mode === 'system') applyTheme();
        });
        applyTheme();

        // --- M3 Pointer Ripple ---
        document.addEventListener('pointerdown', (e) => {
            const target = e.target.closest('.m3-ripple');
            if (!target) return;

            let layer = target.querySelector(':scope > .m3-ripple-layer');
            if (!layer) {
                layer = document.createElement('span');
                layer.className = 'm3-ripple-layer';
                target.prepend(layer);
            }

            const rect = target.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = (e.clientX ? e.clientX - rect.left : rect.width / 2) - size / 2;
            const y = (e.clientY ? e.clientY - rect.top : rect.height / 2) - size / 2;

            const wave = document.createElement('span');
            wave.className = 'm3-ripple-wave';
            wave.style.width = `${size}px`;
            wave.style.height = `${size}px`;
            wave.style.left = `${x}px`;
            wave.style.top = `${y}px`;
            layer.appendChild(wave);
            wave.addEventListener('animationend', () => wave.remove());
        });

        // --- Theme Modal ---
        const themeBtn = document.getElementById('btn-theme');
        const themeModal = document.getElementById('theme-modal');
        const themeDoneBtn = document.getElementById('btn-theme-done');

        function openThemeModal() {
            themeModal.classList.add('open');
            themeBtn.classList.add('is-open');
        }
        function closeThemeModal() {
            themeModal.classList.remove('open');
            themeBtn.classList.remove('is-open');
        }

        themeBtn.addEventListener('click', openThemeModal);
        themeDoneBtn.addEventListener('click', closeThemeModal);
        themeModal.addEventListener('click', (e) => {
            if (e.target === themeModal) closeThemeModal();
        });

        document.querySelectorAll('.mode-opt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                themePrefs.mode = btn.dataset.pickMode;
                applyTheme();
            });
        });
        document.querySelectorAll('.swatch-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                themePrefs.accent = btn.dataset.pickAccent;
                applyTheme();
            });
        });

        // --- Destination Selection & Redirect Logic ---
        const gridEl = document.getElementById('destinations-grid');
        const dockTargetEl = document.getElementById('dock-target');
        const redirectBtn = document.getElementById('btn-redirect');
        const redirectBtnLabel = document.getElementById('btn-redirect-label');
        const instantChk = document.getElementById('instant-redirect-chk');

        let selectedPageId = null;

        try {
            instantChk.checked = localStorage.getItem(INSTANT_KEY) === 'true';
        } catch (e) {}

        instantChk.addEventListener('change', () => {
            localStorage.setItem(INSTANT_KEY, instantChk.checked ? 'true' : 'false');
        });

        function getTargetUrl(page) {
            // Works seamlessly on Vercel clean URLs AND when previewing locally via file://
            return window.location.protocol === 'file:' ? page.file : page.path;
        }

        function redirectTo(page) {
            if (!page) return;
            window.location.href = getTargetUrl(page);
        }

        function selectPage(id) {
            selectedPageId = id;
            const page = PAGES.find(p => p.id === id);

            document.querySelectorAll('.dest-card').forEach(card => {
                const isSelected = card.dataset.pageId === id;
                card.classList.toggle('selected', isSelected);
                card.setAttribute('aria-checked', isSelected ? 'true' : 'false');
            });

            if (page) {
                dockTargetEl.textContent = `${page.title} (${page.path})`;
                redirectBtnLabel.textContent = `Go to ${page.title}`;
                redirectBtn.disabled = false;
            }
        }

        PAGES.forEach((page) => {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'dest-card m3-ripple';
            card.dataset.pageId = page.id;
            card.setAttribute('role', 'radio');
            card.setAttribute('aria-checked', 'false');

            card.innerHTML = `
                <div class="dest-card-top">
                    <span class="dest-icon-badge">
                        <span class="material-symbols-rounded">${page.icon}</span>
                    </span>
                    <span class="dest-check-indicator">
                        <span class="material-symbols-rounded">check</span>
                    </span>
                </div>
                <div class="dest-info">
                    <span class="dest-title">${page.title}</span>
                    <span class="dest-desc">${page.desc}</span>
                </div>
                <span class="dest-path">${page.path}</span>
            `;

            card.addEventListener('click', () => {
                selectPage(page.id);
                if (instantChk.checked) {
                    setTimeout(() => redirectTo(page), 120);
                }
            });

            card.addEventListener('dblclick', () => {
                selectPage(page.id);
                redirectTo(page);
            });

            gridEl.appendChild(card);
        });

        redirectBtn.addEventListener('click', () => {
            const page = PAGES.find(p => p.id === selectedPageId);
            redirectTo(page);
        });

        // Keyboard navigation (Arrow keys + Enter)
        gridEl.addEventListener('keydown', (e) => {
            const cards = Array.from(gridEl.querySelectorAll('.dest-card'));
            const currentIdx = cards.findIndex(c => c.dataset.pageId === selectedPageId);

            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                e.preventDefault();
                const next = cards[(currentIdx + 1) % cards.length];
                selectPage(next.dataset.pageId);
                next.focus();
            } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                e.preventDefault();
                const prev = cards[(currentIdx - 1 + cards.length) % cards.length];
                selectPage(prev.dataset.pageId);
                prev.focus();
            } else if (e.key === 'Enter' && selectedPageId) {
                e.preventDefault();
                redirectTo(PAGES.find(p => p.id === selectedPageId));
            }
        });
    </script>
</body>
</html>
