<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMJK Katholik Melaka • Live Directory & Attendance Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..24,400..700,0..1,0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --md-primary: #0b57d0;
            --md-on-primary: #ffffff;
            --md-primary-container: #d3e3fd;
            --md-on-primary-container: #041e49;

            --md-secondary-container: #cce8ee;
            --md-on-secondary-container: #061f24;

            --md-tertiary-container: #ffd7f5;
            --md-on-tertiary-container: #32042f;

            --md-success: #146c2e;
            --md-success-bright: #1ea446;
            --md-success-container: #c4eed0;
            --md-on-success-container: #072711;

            --md-error: #b3261e;

            --md-surface: #f4f7fc;
            --md-surface-container-lowest: #ffffff;
            --md-surface-container-low: #f8faff;
            --md-surface-container: #eef3fb;
            --md-surface-container-high: #e3eaf6;
            --md-surface-container-highest: #d8e1f0;

            --md-on-surface: #181c22;
            --md-on-surface-variant: #44474e;
            --md-outline: #74777f;
            --md-outline-variant: #c4c7d0;

            --spring-expressive: cubic-bezier(0.34, 1.56, 0.64, 1);
            --spring-spatial: cubic-bezier(0.26, 1.24, 0.42, 1);
            --ease-standard: cubic-bezier(0.2, 0, 0, 1);

            --shape-md: 20px;
            --shape-xl: 34px;
            --shape-pill: 9999px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--md-surface);
            background-image:
                radial-gradient(circle at 8% 4%, rgba(194, 219, 255, 0.55) 0%, transparent 40%),
                radial-gradient(circle at 92% 88%, rgba(232, 213, 255, 0.45) 0%, transparent 42%);
            background-attachment: fixed;
            color: var(--md-on-surface);
            min-height: 100vh;
            padding: 12px;
            padding-bottom: calc(108px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        @media (min-width: 768px) {
            body {
                padding: 24px 28px calc(110px + env(safe-area-inset-bottom)) 28px;
            }
        }

        .material-symbols-rounded {
            font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }

        .material-symbols-rounded.outline-icon {
            font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
        }

        .app-shell {
            max-width: 1420px;
            margin: 0 auto;
        }

        /* EXPRESSIVE HERO HEADER */
        header.hero-card {
            background: linear-gradient(135deg, #d7e6ff 0%, #e7effd 55%, #f0e6ff 100%);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: var(--shape-xl);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 32px -12px rgba(11, 87, 208, 0.14);
            margin-bottom: 18px;
            animation: heroSlideIn 0.5s var(--spring-spatial) backwards;
        }

        @keyframes heroSlideIn {
            from { opacity: 0; transform: translateY(-12px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (min-width: 768px) {
            header.hero-card {
                padding: 28px 32px;
                gap: 20px;
                margin-bottom: 22px;
            }
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .brand-block {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-emblem {
            width: 48px;
            height: 48px;
            border-radius: 18px;
            background: var(--md-primary);
            color: var(--md-on-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(11, 87, 208, 0.25);
            flex-shrink: 0;
            transition: border-radius 0.35s var(--spring-expressive), transform 0.35s var(--spring-expressive);
        }

        .brand-emblem:hover {
            border-radius: 50%;
            transform: rotate(-8deg) scale(1.06);
        }

        @media (min-width: 768px) {
            .brand-emblem {
                width: 56px;
                height: 56px;
                border-radius: 20px;
            }
        }

        .brand-text h1 {
            font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--md-on-primary-container);
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        @media (min-width: 768px) {
            .brand-text h1 { font-size: 2rem; }
        }

        .brand-subtitle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            color: var(--md-on-surface-variant);
            font-size: 0.82rem;
            font-weight: 600;
            flex-wrap: wrap;
        }

        .count-chip {
            background: rgba(11, 87, 208, 0.1);
            color: var(--md-primary);
            padding: 2px 10px;
            border-radius: var(--shape-pill);
            font-size: 0.74rem;
            font-weight: 800;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tonal-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 40px;
            padding: 0 16px;
            border-radius: 16px;
            border: 1px solid rgba(11, 87, 208, 0.14);
            background: rgba(255, 255, 255, 0.9);
            color: var(--md-primary);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.25s var(--spring-expressive), border-radius 0.25s var(--spring-expressive), box-shadow 0.2s ease;
        }

        .tonal-action-btn.primary-filled {
            background: var(--md-primary);
            color: var(--md-on-primary);
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(11, 87, 208, 0.25);
        }

        .tonal-action-btn:hover {
            border-radius: var(--shape-pill);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(11, 87, 208, 0.28);
        }

        .tonal-action-btn:active {
            transform: scale(0.94);
            border-radius: 14px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            padding: 0 14px;
            border-radius: var(--shape-pill);
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--md-success);
            border: 1px solid rgba(20, 108, 46, 0.16);
            cursor: pointer;
            transition: transform 0.2s var(--spring-expressive);
        }

        .live-indicator:active { transform: scale(0.94); }

        .pulse-dot {
            width: 9px;
            height: 9px;
            background-color: var(--md-success-bright);
            border-radius: 50%;
            position: relative;
            flex-shrink: 0;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid var(--md-success-bright);
            animation: ripple 2s infinite var(--ease-standard);
        }

        @keyframes ripple {
            0% { transform: scale(0.75); opacity: 0.9; }
            100% { transform: scale(2.3); opacity: 0; }
        }

        /* SEGMENTED TABS WITH SLIDING PILL */
        .tab-scroll-wrapper {
            position: relative;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            margin: 0 -6px;
            padding: 4px 6px;
        }

        .tab-scroll-wrapper::-webkit-scrollbar { display: none; }

        .tab-container {
            position: relative;
            display: inline-flex;
            min-width: 100%;
            gap: 6px;
            background: rgba(255, 255, 255, 0.72);
            padding: 6px;
            border-radius: var(--shape-pill);
            border: 1px solid rgba(11, 87, 208, 0.08);
        }

        @media (min-width: 768px) {
            .tab-container { min-width: auto; }
        }

        .tab-indicator {
            position: absolute;
            top: 6px;
            left: 6px;
            height: calc(100% - 12px);
            background: var(--md-primary);
            border-radius: var(--shape-pill);
            box-shadow: 0 4px 14px rgba(11, 87, 208, 0.28);
            transition: transform 0.42s var(--spring-expressive), width 0.42s var(--spring-expressive);
            z-index: 0;
            pointer-events: none;
        }

        .tab-btn {
            position: relative;
            z-index: 1;
            background: transparent;
            border: none;
            padding: 10px 18px;
            border-radius: var(--shape-pill);
            font-weight: 700;
            font-size: 0.84rem;
            color: var(--md-on-primary-container);
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
            transition: color 0.2s ease, transform 0.2s var(--spring-expressive);
        }

        .tab-btn:active { transform: scale(0.95); }
        .tab-btn.active { color: var(--md-on-primary); }

        .tab-btn .material-symbols-rounded {
            font-size: 19px;
            transition: transform 0.3s var(--spring-expressive);
        }

        .tab-btn.active .material-symbols-rounded {
            transform: scale(1.1);
        }

        /* SEARCH & FILTER BAR */
        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 720px) {
            .controls-row {
                flex-direction: row;
                align-items: center;
            }
        }

        .search-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            color: var(--md-primary);
            pointer-events: none;
            font-size: 21px;
        }

        .search-bar {
            width: 100%;
            height: 50px;
            background: var(--md-surface-container-lowest);
            border: 2px solid transparent;
            padding: 0 46px 0 48px;
            border-radius: var(--shape-pill);
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--md-on-surface);
            outline: none;
            box-shadow: 0 2px 10px rgba(11, 87, 208, 0.06);
            transition: border-color 0.2s ease, border-radius 0.25s var(--spring-expressive), box-shadow 0.2s ease;
        }

        .search-bar:focus {
            border-color: var(--md-primary);
            border-radius: 20px;
            box-shadow: 0 6px 20px rgba(11, 87, 208, 0.14);
        }

        .clear-btn {
            position: absolute;
            right: 12px;
            background: var(--md-surface-container-high);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--md-on-surface-variant);
        }

        .clear-btn.visible { display: flex; }

        .filter-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-select {
            height: 50px;
            background: var(--md-surface-container-lowest);
            border: 2px solid transparent;
            padding: 0 40px 0 18px;
            border-radius: var(--shape-pill);
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--md-on-primary-container);
            outline: none;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230b57d0'%3e%3cpath d='M7 10l5 5 5-5z'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 22px;
            box-shadow: 0 2px 10px rgba(11, 87, 208, 0.06);
            min-width: 170px;
        }

        .fav-filter-chip {
            height: 50px;
            padding: 0 18px;
            border-radius: var(--shape-pill);
            border: 2px solid transparent;
            background: var(--md-surface-container-lowest);
            color: var(--md-on-surface-variant);
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(11, 87, 208, 0.06);
            transition: transform 0.2s var(--spring-expressive), background-color 0.2s ease, border-radius 0.25s var(--spring-expressive);
        }

        .fav-filter-chip:active { transform: scale(0.94); }

        .fav-filter-chip.active {
            background: #fef3c7;
            color: #92400e;
            border-color: #f59e0b;
            border-radius: 18px;
        }

        /* QUICK CLASS CHIPS */
        .quick-chips-rail {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 2px 10px 2px;
            margin-bottom: 8px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .quick-chips-rail::-webkit-scrollbar { display: none; }

        .m3-chip {
            height: 34px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid var(--md-outline-variant);
            background: var(--md-surface-container-lowest);
            color: var(--md-on-surface-variant);
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            flex-shrink: 0;
            transition: transform 0.2s var(--spring-expressive), border-radius 0.2s var(--spring-expressive), background-color 0.15s ease;
        }

        .m3-chip:active { transform: scale(0.92); }

        .m3-chip.active {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            border-color: transparent;
            border-radius: var(--shape-pill);
        }

        /* DIRECTORY GRID */
        main#cardGrid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 560px) {
            main#cardGrid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 14px;
            }
        }

        @media (min-width: 1024px) {
            main#cardGrid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 16px;
            }
        }

        .card {
            background: var(--md-surface-container-lowest);
            border-radius: var(--shape-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid rgba(116, 119, 127, 0.1);
            box-shadow: 0 2px 8px rgba(18, 28, 45, 0.03);
            cursor: pointer;
            position: relative;
            content-visibility: auto;
            contain-intrinsic-size: 86px;
            transition: transform 0.25s var(--spring-expressive), box-shadow 0.25s ease, border-radius 0.25s var(--spring-expressive);
        }

        .card:hover {
            transform: translateY(-3px);
            border-radius: 24px;
            box-shadow: 0 12px 24px -10px rgba(11, 87, 208, 0.16);
            border-color: rgba(11, 87, 208, 0.2);
        }

        .card:active {
            transform: scale(0.97);
            border-radius: 16px;
        }

        .card.stagger-in {
            animation: cardEntrance 0.38s var(--spring-expressive) backwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(14px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card.card-updated {
            animation: pulseUpdated 1.4s var(--ease-standard);
        }

        @keyframes pulseUpdated {
            0% {
                box-shadow: 0 0 0 0 rgba(30, 164, 70, 0.65);
                background-color: var(--md-success-container);
            }
            100% {
                box-shadow: 0 2px 8px rgba(18, 28, 45, 0.03);
                background-color: var(--md-surface-container-lowest);
            }
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--md-primary-container), #e2d9ff);
            color: var(--md-on-primary-container);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 1.05rem;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
            transition: border-radius 0.3s var(--spring-expressive);
        }

        .card:hover .avatar { border-radius: 50%; }

        .avatar img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .avatar img.loaded { opacity: 1; }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow: hidden;
            flex: 1;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--md-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-fav-star {
            color: #f59e0b;
            font-size: 16px;
            flex-shrink: 0;
        }

        .card-meta {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .pill {
            background: var(--md-primary-container);
            color: var(--md-on-primary-container);
            font-size: 0.68rem;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .pill.role-staff {
            background: var(--md-secondary-container);
            color: var(--md-on-secondary-container);
        }

        .pill.role-prefect {
            background: var(--md-tertiary-container);
            color: var(--md-on-tertiary-container);
        }

        .pill.role-attendance {
            background: var(--md-success-container);
            color: var(--md-on-success-container);
        }

        .subtext {
            font-size: 0.76rem;
            color: var(--md-on-surface-variant);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-weight: 600;
        }

        .card-chevron {
            color: var(--md-outline-variant);
            font-size: 20px;
        }

        /* SCROLL SENTINEL */
        .scroll-sentinel {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--md-on-surface-variant);
            font-size: 0.82rem;
            font-weight: 600;
            margin-top: 8px;
        }

        /* SKELETON LOADERS */
        .skeleton-card {
            background: var(--md-surface-container-lowest);
            border-radius: var(--shape-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(116, 119, 127, 0.08);
        }

        .skeleton-card::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(211, 227, 253, 0.5), transparent);
            animation: shimmer 1.2s infinite;
        }

        @keyframes shimmer { 100% { transform: translateX(100%); } }

        .skeleton-avatar {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: var(--md-surface-container-high);
            flex-shrink: 0;
        }

        .skeleton-line {
            height: 12px;
            border-radius: 8px;
            background: var(--md-surface-container-high);
        }

        /* FLOATING EXTENDED FAB */
        .extended-fab {
            position: fixed;
            right: 20px;
            bottom: calc(20px + env(safe-area-inset-bottom));
            height: 56px;
            padding: 0 22px;
            border-radius: 20px;
            border: none;
            background: var(--md-primary);
            color: var(--md-on-primary);
            font-size: 0.9rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(11, 87, 208, 0.34);
            z-index: 800;
            transition: transform 0.3s var(--spring-expressive), border-radius 0.3s var(--spring-expressive);
        }

        .extended-fab:hover {
            transform: translateY(-3px) scale(1.03);
            border-radius: var(--shape-pill);
        }

        .extended-fab:active {
            transform: scale(0.94);
            border-radius: 16px;
        }

        @media (min-width: 768px) {
            .extended-fab {
                right: 32px;
                bottom: 30px;
            }
        }

        /* BACKDROP & SHEETS */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.48);
            backdrop-filter: blur(6px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 1000;
        }

        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-width: 500px;
            margin: 0 auto;
            background: var(--md-surface-container-low);
            border-radius: 34px 34px 0 0;
            padding: 12px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
            box-shadow: 0 -12px 48px rgba(11, 30, 70, 0.22);
            transform: translateY(105%);
            transition: transform 0.42s var(--spring-spatial), opacity 0.2s ease;
            z-index: 1001;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-height: 92vh;
            overflow-y: auto;
        }

        .bottom-sheet.open {
            transform: translateY(0);
        }

<body>

    <div class="app-shell">
        <header class="hero-card">

    <script>
        const getTodayDateString = () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const endpointMap = {
            students: 'https://www.chsmelaka.com/api/school/getStudents',
            staff: 'https://www.chsmelaka.com/api/school/getStaff',
            prefects: 'https://www.chsmelaka.com/api/prefect/getPrefect',
            librarians: 'https://www.chsmelaka.com/api/library/getLibrarians',
            attendance: `https://www.chsmelaka.com/api/school/edatang/getAttendance?date=${getTodayDateString()}`
        };

        const RENDER_BATCH_SIZE = 40;

        let currentDataset = [];
        let serializedByKey = new Map();
        let cachedStudentsDataset = [];
        let currentlyDisplayedRecords = [];
        let renderedCount = 0;

        let activeCategory = 'students';
        let pollTimer = null;
        let searchDebounceTimer = null;
        let selectedRecordIndex = -1;
        let favoritesOnly = false;
        let selectedNamingFormat = 'id-name';
        let exportAbortController = null;
        let snackbarTimer = null;
        let preferredImageTransport = null; // Remembers fastest valid transport during ZIP export

        const favoriteIds = new Set((() => {
            try { return JSON.parse(localStorage.getItem('smjk_favs') || '[]'); }
            catch { return []; }
        })());

        function saveFavorites() {
            try { localStorage.setItem('smjk_favs', JSON.stringify([...favoriteIds])); } catch (_) {}
        }

        const grid = document.getElementById('cardGrid');
        const scrollSentinel = document.getElementById('scrollSentinel');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const secondaryFilter = document.getElementById('secondaryFilter');
        const favFilterBtn = document.getElementById('favFilterBtn');
        const quickChipsRail = document.getElementById('quickChipsRail');
        const recordCountBadge = document.getElementById('recordCountBadge');

        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabIndicator = document.getElementById('tabIndicator');
        const syncStatus = document.getElementById('syncStatus');
        const liveBadge = document.getElementById('liveBadge');

        const sheetBackdrop = document.getElementById('sheetBackdrop');
        const bottomSheet = document.getElementById('bottomSheet');
        const doneSheetBtn = document.getElementById('doneSheetBtn');
        const prevStudentBtn = document.getElementById('prevStudentBtn');
        const nextStudentBtn = document.getElementById('nextStudentBtn');
        const shareSheetBtn = document.getElementById('shareSheetBtn');
        const starSheetBtn = document.getElementById('starSheetBtn');
        const sheetAvatarContainer = document.getElementById('sheetAvatarContainer');
        const sheetNameEn = document.getElementById('sheetNameEn');
        const sheetNameCn = document.getElementById('sheetNameCn');
        const sheetDetailsCard = document.getElementById('sheetDetailsCard');

        const headerExportBtn = document.getElementById('headerExportBtn');
        const fabExportBtn = document.getElementById('fabExportBtn');
        const exportDialog = document.getElementById('exportDialog');
        const closeExportBtn = document.getElementById('closeExportBtn');
        const cancelExportBtn = document.getElementById('cancelExportBtn');
        const exportClassSelect = document.getElementById('exportClassSelect');
        const exportStudentCount = document.getElementById('exportStudentCount');
        const namingOptions = document.querySelectorAll('.naming-option');
        const exportProgressBox = document.getElementById('exportProgressBox');
        const exportProgressLabel = document.getElementById('exportProgressLabel');
        const exportProgressPercent = document.getElementById('exportProgressPercent');
        const exportProgressFill = document.getElementById('exportProgressFill');
        const exportThumbStrip = document.getElementById('exportThumbStrip');
        const startExportBtn = document.getElementById('startExportBtn');

        const snackbar = document.getElementById('snackbar');
        const snackbarText = document.getElementById('snackbarText');
        const snackbarIcon = document.getElementById('snackbarIcon');

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showSnackbar(message, icon = 'info') {
            snackbarText.textContent = message;
            snackbarIcon.textContent = icon;
            snackbar.classList.add('show');
            clearTimeout(snackbarTimer);
            snackbarTimer = setTimeout(() => snackbar.classList.remove('show'), 3000);
        }

        function updateTabIndicator(activeBtn) {
            if (!activeBtn) return;
            tabIndicator.style.width = `${activeBtn.offsetWidth}px`;
            tabIndicator.style.transform = `translateX(${activeBtn.offsetLeft - 6}px)`;
        }

        window.addEventListener('resize', () => {
            updateTabIndicator(document.querySelector('.tab-btn.active'));
        });

        function renderSkeletons() {
            let html = '';
            for (let i = 0; i < 8; i++) {
                html += `
                    <div class="skeleton-card">
                        <div class="skeleton-avatar"></div>
                        <div style="flex:1; display:flex; flex-direction:column; gap:10px;">
                            <div class="skeleton-line" style="width: ${60 + (i % 3) * 12}%;"></div>
                            <div class="skeleton-line" style="width: 42%;"></div>
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = html;
            scrollSentinel.style.display = 'none';
        }

        async function fetchDirectoryData(targetUrl) {
            const gatewayUrl = `/api/proxy?target=${encodeURIComponent(targetUrl)}`;
            const response = await fetch(gatewayUrl);
            if (!response.ok) throw new Error(`Gateway status: ${response.status}`);
            return await response.json();
        }

        function normalizePayload(payload) {
            if (!Array.isArray(payload)) {
                payload = payload.data || payload.records || Object.values(payload).find(v => Array.isArray(v)) || [];
            }
            return Array.isArray(payload) ? payload : [];
        }

        function buildIndexMap(dataset) {
            const map = new Map();
            for (let i = 0; i < dataset.length; i++) {
                map.set(getRecordKey(dataset[i]), JSON.stringify(dataset[i]));
            }
            return map;
        }

        async function loadDirectory(category, isBackgroundRefresh = false) {
            activeCategory = category;

            if (!isBackgroundRefresh) {
                renderSkeletons();
                searchInput.value = '';
                clearSearchBtn.classList.remove('visible');
                secondaryFilter.style.display = 'none';
                quickChipsRail.style.display = 'none';
                quickChipsRail.innerHTML = '';
                recordCountBadge.textContent = 'Syncing...';
            }

            try {
                const rawPayload = await fetchDirectoryData(endpointMap[category]);
                const freshDataset = normalizePayload(rawPayload);

                if (category === 'students') {
                    cachedStudentsDataset = freshDataset;
                }

                if (isBackgroundRefresh) {
                    handleIncrementalUpdate(freshDataset);
                } else {
                    currentDataset = freshDataset;
                    serializedByKey = buildIndexMap(freshDataset);
                    buildFilterOptions(category);
                    applySearchFilter(true);
                }

                syncStatus.textContent = 'Synced';
                setTimeout(() => { syncStatus.textContent = 'Auto-Syncing'; }, 2000);
            } catch (err) {
                console.error(err);
                if (!isBackgroundRefresh) {
                    recordCountBadge.textContent = 'Offline';
                    grid.innerHTML = `
                        <div class="empty-state">
                            <span class="material-symbols-rounded">cloud_off</span>
                            <h3>Unable to load live records</h3>
                            <p style="font-size:0.86rem; color:var(--md-on-surface-variant);">Check your connection or proxy gateway and tap Sync.</p>
                        </div>
                    `;
                }
            }
        }

        function getRecordKey(entry) {
            return String(entry.id || entry.student_id || entry.staff_id || entry.name || '');
        }

        function getProfilePicUrl(entry, categoryOverride = null) {
            const cat = categoryOverride || activeCategory;
            const recordId = entry.id || entry.student_id || entry.staff_id || '';
            if (entry.picture) {
                return entry.picture.startsWith('http') ? entry.picture : `http://cdn.owonico.link${entry.picture}`;
            } else if (cat === 'students' && recordId) {
                return `http://cdn.owonico.link/files/sems/meb2099/student/${recordId}.jpg`;
            }
            return '';
        }

        function generateInitials(textName) {
            if (!textName) return '?';
            const words = textName.trim().split(/\s+/).filter(Boolean);
            if (words.length === 0) return '?';
            return words.slice(0, 2).map(n => n[0]).join('').toUpperCase();
        }

        function handleIncrementalUpdate(freshDataset) {
            const newMap = buildIndexMap(freshDataset);
            const changedIds = new Set();

            newMap.forEach((serialized, key) => {
                if (serializedByKey.get(key) !== serialized) {
                    changedIds.add(key);
                }
            });

            const countChanged = freshDataset.length !== currentDataset.length;

            // Zero DOM work if nothing changed!
            if (changedIds.size === 0 && !countChanged) {
                return;
            }

            currentDataset = freshDataset;
            serializedByKey = newMap;

            // If items were added/removed, re-filter smoothly; if only existing items updated, patch in-place
            if (countChanged) {
                applySearchFilter(false, changedIds);
            } else {
                // Re-map displayed records without destroying the whole grid
                const freshByKey = new Map();
                freshDataset.forEach(item => freshByKey.set(getRecordKey(item), item));

                currentlyDisplayedRecords = currentlyDisplayedRecords.map(oldItem => {
                    const k = getRecordKey(oldItem);
                    return freshByKey.get(k) || oldItem;
                });

                changedIds.forEach(key => {
                    const cardNode = grid.querySelector(`.card[data-id="${CSS.escape(key)}"]`);
                    if (cardNode) {
                        const idx = currentlyDisplayedRecords.findIndex(item => getRecordKey(item) === key);
                        if (idx !== -1) {
                            const updatedCard = createCardElement(currentlyDisplayedRecords[idx], idx, false);
                            updatedCard.classList.add('card-updated');
                            cardNode.replaceWith(updatedCard);
                        }
                    }
                });
            }

            if (selectedRecordIndex >= 0 && currentlyDisplayedRecords[selectedRecordIndex]) {
                const curKey = getRecordKey(currentlyDisplayedRecords[selectedRecordIndex]);
                if (changedIds.has(curKey)) {
                    populateBottomSheet(currentlyDisplayedRecords[selectedRecordIndex]);
                }
            }
        }

        function buildFilterOptions(category) {
            let options = [];
            let allLabel = 'All Groups';

            if (category === 'students') {
                options = [...new Set(currentDataset.map(item => item.class || item.form))].filter(Boolean).sort();
                allLabel = 'All Classes';
            } else if (category === 'staff') {
                options = [...new Set(currentDataset.map(item => item.section))].filter(Boolean).sort();
                allLabel = 'All Sections';
            }

            if (options.length > 0) {
                secondaryFilter.innerHTML = `<option value="">${allLabel}</option>`;
                options.forEach(opt => {
                    secondaryFilter.innerHTML += `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`;
                });
                secondaryFilter.style.display = 'block';

                let chipsHtml = `<button class="m3-chip active" data-filter="">${allLabel}</button>`;
                options.forEach(opt => {
                    chipsHtml += `<button class="m3-chip" data-filter="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`;
                });
                quickChipsRail.innerHTML = chipsHtml;
                quickChipsRail.style.display = 'flex';

                quickChipsRail.querySelectorAll('.m3-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        secondaryFilter.value = chip.dataset.filter;
                        syncChipActiveState(chip.dataset.filter);
                        applySearchFilter(false);
                    });
                });
            } else {
                secondaryFilter.style.display = 'none';
                quickChipsRail.style.display = 'none';
            }
        }

        function syncChipActiveState(val) {
            quickChipsRail.querySelectorAll('.m3-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.filter === val);
            });
        }

        function getPillClass() {
            if (activeCategory === 'staff') return 'pill role-staff';
            if (activeCategory === 'prefects' || activeCategory === 'librarians') return 'pill role-prefect';
            if (activeCategory === 'attendance') return 'pill role-attendance';
            return 'pill';
        }

        function createCardElement(entry, index, allowEntranceAnim) {
            const cardNode = document.createElement('div');
            const animate = allowEntranceAnim && index < 16;
            cardNode.className = 'card' + (animate ? ' stagger-in' : '');
            if (animate) {
                cardNode.style.animationDelay = `${index * 18}ms`;
            }

            const key = getRecordKey(entry);
            cardNode.setAttribute('data-id', key);

            const fullName = entry.name || entry.fullname || entry.student_name || entry.nama || '';
            const recordId = entry.id || entry.student_id || entry.staff_id || '';
            const badgeLabel = entry.class || entry.section || entry.role || entry.status || '';
            const profileImgUrl = getProfilePicUrl(entry);
            const initials = generateInitials(fullName);
            const isFav = favoriteIds.has(key);

            cardNode.innerHTML = `
                <div class="avatar">
                    <span>${escapeHtml(initials)}</span>
                    ${profileImgUrl ? `<img src="${escapeHtml(profileImgUrl)}" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.remove()">` : ''}
                </div>
                <div class="card-info">
                    <div class="card-title-row">
                        <div class="card-title" title="${escapeHtml(fullName)}">${escapeHtml(fullName || recordId)}</div>
                        ${isFav ? `<span class="material-symbols-rounded card-fav-star">star</span>` : ''}
                    </div>
                    <div class="card-meta">
                        ${badgeLabel ? `<span class="${getPillClass()}">${escapeHtml(badgeLabel)}</span>` : ''}
                        ${recordId ? `<span class="subtext">${escapeHtml(recordId)}</span>` : ''}
                    </div>
                </div>
                <span class="material-symbols-rounded card-chevron">chevron_right</span>
            `;

            cardNode.addEventListener('click', () => openBottomSheet(index));
            return cardNode;
        }

        function appendNextBatch(animateFirstBatch = false) {
            if (renderedCount >= currentlyDisplayedRecords.length) {
                scrollSentinel.style.display = 'none';
                return;
            }

            const nextEnd = Math.min(renderedCount + RENDER_BATCH_SIZE, currentlyDisplayedRecords.length);
            const fragment = document.createDocumentFragment();

            for (let i = renderedCount; i < nextEnd; i++) {
                fragment.appendChild(createCardElement(currentlyDisplayedRecords[i], i, animateFirstBatch));
            }

            grid.appendChild(fragment);
            renderedCount = nextEnd;

            if (renderedCount < currentlyDisplayedRecords.length) {
                scrollSentinel.style.display = 'flex';
                scrollSentinel.textContent = `Showing ${renderedCount} of ${currentlyDisplayedRecords.length} • Scroll for more`;
            } else {
                scrollSentinel.style.display = 'none';
            }
        }

        // Progressive Infinite Scroll via IntersectionObserver (keeps DOM fast even for 2,500+ students)
        const batchObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && renderedCount < currentlyDisplayedRecords.length) {
                appendNextBatch(false);
            }
        }, { rootMargin: '450px' });
        batchObserver.observe(scrollSentinel);

        function renderDirectoryCards(records, isInitial = false) {
            currentlyDisplayedRecords = records;
            renderedCount = 0;
            grid.innerHTML = '';
            recordCountBadge.textContent = `${records.length} ${records.length === 1 ? 'record' : 'records'}`;

            if (records.length === 0) {
                scrollSentinel.style.display = 'none';
                grid.innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-rounded">search_off</span>
                        <h3>No matching records</h3>
                        <p style="font-size:0.86rem; color:var(--md-on-surface-variant);">Try adjusting your search query or selected filters.</p>
                    </div>
                `;
                return;
            }

            appendNextBatch(isInitial);
        }

        function applySearchFilter(isInitial = false) {
            const keyword = searchInput.value.trim().toLowerCase();
            const filterValue = secondaryFilter.value;

            clearSearchBtn.classList.toggle('visible', keyword.length > 0);

            const matchedRecords = currentDataset.filter(entry => {
                if (favoritesOnly && !favoriteIds.has(getRecordKey(entry))) return false;

                if (activeCategory === 'students' && filterValue && (entry.class || entry.form) !== filterValue) {
                    return false;
                }
                if (activeCategory === 'staff' && filterValue && entry.section !== filterValue) {
                    return false;
                }

                if (!keyword) return true;

                const nameText = (entry.name || entry.fullname || entry.student_name || entry.nama || '').toLowerCase();
                const cnameText = (entry.cname || entry.chinese_name || entry.nama_cina || entry.chineseName || '').toLowerCase();
                const classText = (entry.class || entry.form || entry.section || '').toString().toLowerCase();
                const idText = (entry.id || entry.student_id || entry.staff_id || '').toString().toLowerCase();

                return nameText.includes(keyword) || cnameText.includes(keyword) || idText.includes(keyword) || classText.includes(keyword);
            });

            renderDirectoryCards(matchedRecords, isInitial);
        }

        /* PROFILE SHEET */
        function populateBottomSheet(entry) {
            if (!entry) return;

            const fullName = entry.name || entry.fullname || entry.student_name || entry.nama || '';
            const chineseName = entry.cname || entry.chinese_name || entry.nama_cina || entry.chineseName || '';
            const recordId = entry.id || entry.student_id || entry.staff_id || '';
            const recordKey = getRecordKey(entry);
            const imgUrl = getProfilePicUrl(entry);
            const initials = generateInitials(fullName);

            sheetNameEn.textContent = fullName || recordId || '';
            if (chineseName) {
                sheetNameCn.textContent = chineseName;
                sheetNameCn.style.display = 'block';
            } else {
                sheetNameCn.textContent = '';
                sheetNameCn.style.display = 'none';
            }

            if (imgUrl) {
                sheetAvatarContainer.innerHTML = `<img src="${escapeHtml(imgUrl)}" alt="${escapeHtml(fullName)}" decoding="async" onerror="this.parentElement.innerHTML='<span class=\\'sheet-avatar-placeholder\\'>${escapeHtml(initials)}</span>'">`;
            } else {
                sheetAvatarContainer.innerHTML = `<span class="sheet-avatar-placeholder">${escapeHtml(initials)}</span>`;
            }

            if (recordKey && favoriteIds.has(recordKey)) {
                starSheetBtn.classList.add('starred');
                starSheetBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 22px;">star</span>';
            } else {
                starSheetBtn.classList.remove('starred');
                starSheetBtn.innerHTML = '<span class="material-symbols-rounded outline-icon" style="font-size: 22px;">star</span>';
            }

            const currentYear = new Date().getFullYear();
            const prevYear = currentYear - 1;
            let rowsHtml = '';

            if (activeCategory === 'students') {
                const curClass = entry.class || entry.tingkatan || entry.form;
                if (curClass) {
                    rowsHtml += `<div class="sheet-row"><span class="sheet-label">Current Class</span><span class="sheet-val highlight-green">${escapeHtml(curClass)}</span></div>`;
                }

                const prevClass = entry.last_class || entry.prev_class || entry.old_class || entry.kelas_lama || entry.class_prev || entry[`class_${prevYear}`] || entry['2025_class'];
                if (prevClass) {
                    rowsHtml += `<div class="sheet-row"><span class="sheet-label">${prevYear} Class</span><span class="sheet-val">${escapeHtml(prevClass)}</span></div>`;
                }

                const rawStatus = entry.status ?? entry.status_pembelajaran ?? entry.student_status;
                if (rawStatus !== undefined && rawStatus !== null && rawStatus !== '') {
                    const statusStr = String(rawStatus).trim().toLowerCase();
                    let statusContent = '';

                    if (statusStr === 'up' || statusStr === 'naik' || statusStr === 'promoted' || statusStr === '1' || rawStatus === true) {
                        statusContent = `<span class="material-symbols-rounded sheet-status-arrow">arrow_upward</span>`;
                    } else if (statusStr === 'kekal' || statusStr === 'stay' || statusStr === '0' || rawStatus === false) {
                        statusContent = `<span class="material-symbols-rounded" style="color: var(--md-outline); font-size: 20px;">horizontal_rule</span>`;
                    } else {
                        statusContent = `<span class="sheet-val">${escapeHtml(rawStatus)}</span>`;
                    }

                    rowsHtml += `<div class="sheet-row"><span class="sheet-label">Status</span><span class="sheet-val">${statusContent}</span></div>`;
                }

                const primarySchool = entry.primary_school || entry.srjk || entry.primary || entry.sekolah_rendah || entry.school_from;
                if (primarySchool) {
                    rowsHtml += `<div class="sheet-row"><span class="sheet-label">Primary School</span><span class="sheet-val">${escapeHtml(primarySchool)}</span></div>`;
                }

                if (recordId) {
                    rowsHtml += `<div class="sheet-row"><span class="sheet-label">Student ID</span><span class="sheet-val">${escapeHtml(recordId)}</span></div>`;
                }
            } else if (activeCategory === 'staff') {
                const section = entry.section || entry.department || entry.bidang;
                if (section) rowsHtml += `<div class="sheet-row"><span class="sheet-label">Section</span><span class="sheet-val highlight-green">${escapeHtml(section)}</span></div>`;
                const role = entry.role || entry.jawatan || entry.position;
                if (role) rowsHtml += `<div class="sheet-row"><span class="sheet-label">Role</span><span class="sheet-val">${escapeHtml(role)}</span></div>`;
                if (recordId) rowsHtml += `<div class="sheet-row"><span class="sheet-label">Staff ID</span><span class="sheet-val">${escapeHtml(recordId)}</span></div>`;
            } else {
                const roleOrClass = entry.class || entry.role || entry.position || entry.section;
                if (roleOrClass) rowsHtml += `<div class="sheet-row"><span class="sheet-label">Role / Class</span><span class="sheet-val highlight-green">${escapeHtml(roleOrClass)}</span></div>`;
                const statusOrTime = entry.time || entry.date || entry.timestamp || entry.status;
                if (statusOrTime) rowsHtml += `<div class="sheet-row"><span class="sheet-label">Status / Time</span><span class="sheet-val">${escapeHtml(statusOrTime)}</span></div>`;
                if (recordId) rowsHtml += `<div class="sheet-row"><span class="sheet-label">ID</span><span class="sheet-val">${escapeHtml(recordId)}</span></div>`;
            }

            sheetDetailsCard.innerHTML = rowsHtml || `<div class="sheet-row"><span class="sheet-label">Details</span><span class="sheet-val">-</span></div>`;

            prevStudentBtn.disabled = selectedRecordIndex <= 0;
            prevStudentBtn.style.opacity = selectedRecordIndex <= 0 ? '0.35' : '1';
            nextStudentBtn.disabled = selectedRecordIndex >= currentlyDisplayedRecords.length - 1;
            nextStudentBtn.style.opacity = selectedRecordIndex >= currentlyDisplayedRecords.length - 1 ? '0.35' : '1';
        }

        function openBottomSheet(index) {
            selectedRecordIndex = index;
            populateBottomSheet(currentlyDisplayedRecords[selectedRecordIndex]);
            sheetBackdrop.classList.add('active');
            bottomSheet.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeAllModals() {
            sheetBackdrop.classList.remove('active');
            bottomSheet.classList.remove('open');
            exportDialog.classList.remove('open');
            document.body.style.overflow = '';
            selectedRecordIndex = -1;
            if (exportAbortController) {
                exportAbortController.abort();
                exportAbortController = null;
            }
        }

        doneSheetBtn.addEventListener('click', closeAllModals);
        sheetBackdrop.addEventListener('click', closeAllModals);

        prevStudentBtn.addEventListener('click', () => {
            if (selectedRecordIndex > 0) {
                selectedRecordIndex--;
                populateBottomSheet(currentlyDisplayedRecords[selectedRecordIndex]);
            }
        });

        nextStudentBtn.addEventListener('click', () => {
            if (selectedRecordIndex < currentlyDisplayedRecords.length - 1) {
                selectedRecordIndex++;
                populateBottomSheet(currentlyDisplayedRecords[selectedRecordIndex]);
            }
        });

        starSheetBtn.addEventListener('click', () => {
            const entry = currentlyDisplayedRecords[selectedRecordIndex];
            if (!entry) return;
            const recordKey = getRecordKey(entry);
            if (favoriteIds.has(recordKey)) {
                favoriteIds.delete(recordKey);
                showSnackbar('Removed from favorites', 'star_outline');
            } else {
                favoriteIds.add(recordKey);
                showSnackbar('Added to favorites', 'star');
            }
            saveFavorites();
            populateBottomSheet(entry);

            // Patch visible card in-place without rebuilding grid
            const cardNode = grid.querySelector(`.card[data-id="${CSS.escape(recordKey)}"]`);
            if (cardNode) {
                cardNode.replaceWith(createCardElement(entry, selectedRecordIndex, false));
            }
            if (favoritesOnly) applySearchFilter(false);
        });

        shareSheetBtn.addEventListener('click', async () => {
            const entry = currentlyDisplayedRecords[selectedRecordIndex];
            if (!entry) return;
            const fullName = entry.name || entry.fullname || entry.student_name || '';
            const recordId = getRecordKey(entry);
            const shareText = `${fullName} (${recordId}) • SMJK Katholik Melaka`;

            if (navigator.share) {
                try { await navigator.share({ title: fullName, text: shareText }); } catch (_) {}
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(shareText);
                showSnackbar('Copied profile to clipboard', 'check_circle');
            }
        });

        document.addEventListener('keydown', (e) => {
            if (bottomSheet.classList.contains('open')) {
                if (e.key === 'Escape') closeAllModals();
                if (e.key === 'ArrowLeft' && selectedRecordIndex > 0) prevStudentBtn.click();
                if (e.key === 'ArrowRight' && selectedRecordIndex < currentlyDisplayedRecords.length - 1) nextStudentBtn.click();
            } else if (exportDialog.classList.contains('open') && e.key === 'Escape') {
                closeAllModals();
            }
        });

        let touchStartY = 0;
        bottomSheet.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        bottomSheet.addEventListener('touchmove', e => {
            if (e.touches[0].clientY - touchStartY > 95) closeAllModals();
        }, { passive: true });

        // Debounced search (prevents main-thread lag while typing fast)
        searchInput.addEventListener('input', () => {
            clearSearchBtn.classList.toggle('visible', searchInput.value.trim().length > 0);
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => applySearchFilter(false), 110);
        });

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            searchInput.focus();
            applySearchFilter(false);
        });

        secondaryFilter.addEventListener('change', () => {
            syncChipActiveState(secondaryFilter.value);
            applySearchFilter(false);
        });

        favFilterBtn.addEventListener('click', () => {
            favoritesOnly = !favoritesOnly;
            favFilterBtn.classList.toggle('active', favoritesOnly);
            favFilterBtn.querySelector('.material-symbols-rounded').classList.toggle('outline-icon', !favoritesOnly);
            applySearchFilter(false);
        });

        liveBadge.addEventListener('click', () => {
            syncStatus.textContent = 'Updating...';
            loadDirectory(activeCategory, true);
        });

        tabButtons.forEach(btn => {
            btn.addEventListener('click', (event) => {
                tabButtons.forEach(b => b.classList.remove('active'));
                const target = event.currentTarget;
                target.classList.add('active');
                updateTabIndicator(target);
                target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

                clearInterval(pollTimer);
                loadDirectory(target.dataset.endpoint, false);
                startPolling(target.dataset.endpoint);
            });
        });

        // Smart polling: attendance polls every 15s, static directories every 60s, and pauses when tab is hidden
        function startPolling(category) {
            const intervalMs = category === 'attendance' ? 15000 : 60000;
            pollTimer = setInterval(() => {
                if (document.hidden) return;
                if (bottomSheet.classList.contains('open') || exportDialog.classList.contains('open')) return;
                loadDirectory(category, true);
            }, intervalMs);
        }

        /* =========================================================
           CLASS PHOTO ZIP EXPORTER (WITH BINARY INTEGRITY VALIDATION)
           ========================================================= */
        function sanitizeFilename(name) {
            return String(name || 'student')
                .replace(/[\\/:*?"<>|]+/g, '_')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function getStudentsByClass(className) {
            return cachedStudentsDataset.filter(s => (s.class || s.form) === className);
        }

        function populateExportClassDropdown() {
            const classGroups = [...new Set(cachedStudentsDataset.map(s => s.class || s.form))].filter(Boolean).sort();
            if (classGroups.length === 0) {
                exportClassSelect.innerHTML = `<option value="">No classes found</option>`;
                exportStudentCount.textContent = '0';
                startExportBtn.disabled = true;
                return;
            }

            exportClassSelect.innerHTML = classGroups.map(cls => {
                const count = getStudentsByClass(cls).length;
                return `<option value="${escapeHtml(cls)}">Class ${escapeHtml(cls)} (${count} students)</option>`;
            }).join('');

            if (activeCategory === 'students' && secondaryFilter.value && classGroups.includes(secondaryFilter.value)) {
                exportClassSelect.value = secondaryFilter.value;
            }

            updateExportClassSummary();
        }

        function updateExportClassSummary() {
            const chosenClass = exportClassSelect.value;
            const list = getStudentsByClass(chosenClass);
            exportStudentCount.textContent = list.length;
            startExportBtn.disabled = list.length === 0;
        }

        async function openExportModal() {
            exportProgressBox.classList.remove('visible');
            exportProgressFill.style.width = '0%';
            exportProgressPercent.textContent = '0%';
            exportThumbStrip.innerHTML = '';
            startExportBtn.disabled = false;
            startExportBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 20px;">download</span><span>Download ZIP</span>';

            sheetBackdrop.classList.add('active');
            exportDialog.classList.add('open');
            document.body.style.overflow = 'hidden';

            if (cachedStudentsDataset.length === 0) {
                exportClassSelect.innerHTML = '<option value="">Loading classes...</option>';
                exportStudentCount.textContent = '...';
                startExportBtn.disabled = true;
                try {
                    const payload = await fetchDirectoryData(endpointMap.students);
                    cachedStudentsDataset = normalizePayload(payload);
                } catch {
                    showSnackbar('Failed to load student directory', 'error');
                }
            }
            populateExportClassDropdown();
        }

        headerExportBtn.addEventListener('click', openExportModal);
        fabExportBtn.addEventListener('click', openExportModal);
        closeExportBtn.addEventListener('click', closeAllModals);
        cancelExportBtn.addEventListener('click', closeAllModals);
        exportClassSelect.addEventListener('change', updateExportClassSummary);

        namingOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                namingOptions.forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedNamingFormat = opt.dataset.format;
            });
        });

        async function detectAndValidateImage(blob) {
            if (!blob || blob.size < 100) return { valid: false, reason: 'empty', ext: 'jpg' };

            const header = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
            let ext = null;

            if (header[0] === 0xFF && header[1] === 0xD8 && header[2] === 0xFF) ext = 'jpg';
            else if (header[0] === 0x89 && header[1] === 0x50 && header[2] === 0x4E && header[3] === 0x47) ext = 'png';
            else if (header[0] === 0x47 && header[1] === 0x49 && header[2] === 0x46 && header[3] === 0x38) ext = 'gif';
            else if (
                header[0] === 0x52 && header[1] === 0x49 && header[2] === 0x46 && header[3] === 0x46 &&
                header[8] === 0x57 && header[9] === 0x45 && header[10] === 0x42 && header[11] === 0x50
            ) ext = 'webp';

            if (!ext) {
                return { valid: false, reason: 'corrupt', ext: 'jpg' };
            }

            if (typeof createImageBitmap === 'function') {
                try {
                    const bitmap = await createImageBitmap(blob);
                    bitmap.close();
                } catch {
                    return { valid: false, reason: 'corrupt', ext };
                }
            }

            return { valid: true, reason: 'ok', ext };
        }

        function buildImageCandidates(url) {
            const httpsUrl = url.startsWith('http://') ? url.replace('http://', 'https://') : url;
            const list = [
                { key: 'direct-https', url: httpsUrl },
                { key: 'direct-raw', url: url },
                { key: 'proxy-raw', url: `/api/proxy?target=${encodeURIComponent(url)}` },
                { key: 'proxy-https', url: `/api/proxy?target=${encodeURIComponent(httpsUrl)}` }
            ];

            // Deduplicate URLs
            const seen = new Set();
            const unique = list.filter(item => {
                if (seen.has(item.url)) return false;
                seen.add(item.url);
                return true;
            });

            // Prioritize whichever transport already returned valid binary images
            if (preferredImageTransport) {
                unique.sort((a, b) => (a.key === preferredImageTransport ? -1 : b.key === preferredImageTransport ? 1 : 0));
            }
            return unique;
        }

        async function fetchValidImage(url, signal) {
            const candidates = buildImageCandidates(url);
            let sawCorruptProxy = false;

            for (const candidate of candidates) {
                try {
                    const res = await fetch(candidate.url, { signal });
                    if (!res.ok) continue;

                    const blob = await res.blob();
                    const check = await detectAndValidateImage(blob);

                    if (check.valid) {
                        preferredImageTransport = candidate.key;
                        const buffer = await blob.arrayBuffer();
                        return { buffer, blob, ext: check.ext };
                    } else if (check.reason === 'corrupt' && candidate.key.startsWith('proxy')) {
                        sawCorruptProxy = true;
                    }
                } catch (err) {
                    if (err.name === 'AbortError') throw err;
                }
            }

            return { buffer: null, sawCorruptProxy };
        }

        function formatStudentFilename(student, ext) {
            const id = sanitizeFilename(student.id || student.student_id || 'unknown');
            const name = sanitizeFilename(student.name || student.fullname || student.student_name || student.nama || id);

            if (selectedNamingFormat === 'name-id') return `${name} (${id}).${ext}`;
            if (selectedNamingFormat === 'id') return `${id}.${ext}`;
            return `${id} - ${name}.${ext}`;
        }

        startExportBtn.addEventListener('click', async () => {
            if (typeof JSZip === 'undefined') {
                showSnackbar('ZIP library is still loading or offline.', 'error');
                return;
            }

            const chosenClass = exportClassSelect.value;
            const students = getStudentsByClass(chosenClass);
            if (students.length === 0) return;

            preferredImageTransport = null;
            exportAbortController = new AbortController();
            const signal = exportAbortController.signal;

            startExportBtn.disabled = true;
            startExportBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 20px;">hourglass_top</span><span>Exporting...</span>';
            exportProgressBox.classList.add('visible');
            exportThumbStrip.innerHTML = '';

            const zip = new JSZip();
            const folderName = sanitizeFilename(`Class_${chosenClass}_Photos`);
            const folder = zip.folder(folderName);

            let processed = 0;
            let downloaded = 0;
            let skipped = 0;
            let corruptProxyHits = 0;
            const total = students.length;
            const usedFilenames = new Set();

            const updateProgress = () => {
                const pct = Math.round((processed / total) * 100);
                exportProgressFill.style.width = `${pct}%`;
                exportProgressPercent.textContent = `${pct}%`;
                exportProgressLabel.textContent = `Fetching ${processed} / ${total} (${downloaded} valid, ${skipped} skipped)`;
            };

            updateProgress();

            let queueIndex = 0;
            const concurrency = 4;

            async function worker() {
                while (queueIndex < students.length) {
                    if (signal.aborted) return;
                    const idx = queueIndex++;
                    const student = students[idx];
                    const imgUrl = getProfilePicUrl(student, 'students');

                    if (!imgUrl) {
                        skipped++;
                        processed++;
                        updateProgress();
                        continue;
                    }

                    const result = await fetchValidImage(imgUrl, signal);
                    if (signal.aborted) return;

                    if (result.buffer) {
                        let filename = formatStudentFilename(student, result.ext);
                        let counter = 2;
                        while (usedFilenames.has(filename)) {
                            const dot = filename.lastIndexOf('.');
                            filename = `${filename.slice(0, dot)}_${counter}${filename.slice(dot)}`;
                            counter++;
                        }
                        usedFilenames.add(filename);

                        // Pass verified raw ArrayBuffer so JSZip never corrupts binary image data
                        folder.file(filename, result.buffer, { binary: true });
                        downloaded++;

                        const thumbUrl = URL.createObjectURL(result.blob);
                        const imgEl = document.createElement('img');
                        imgEl.src = thumbUrl;
                        imgEl.className = 'thumb-mini';
                        imgEl.onload = () => URL.revokeObjectURL(thumbUrl);
                        exportThumbStrip.appendChild(imgEl);
                        if (exportThumbStrip.children.length > 16) {
                            exportThumbStrip.firstElementChild.remove();
                        }
                        exportThumbStrip.scrollLeft = exportThumbStrip.scrollWidth;
                    } else {
                        if (result.sawCorruptProxy) corruptProxyHits++;
                        skipped++;
                    }

                    processed++;
                    updateProgress();
                }
            }

            try {
                await Promise.all(Array.from({ length: Math.min(concurrency, students.length) }, worker));
                if (signal.aborted) return;

                if (downloaded === 0) {
                    if (corruptProxyHits > 0) {
                        exportProgressLabel.textContent = 'Blocked: /api/proxy returned text-corrupted image bytes and CDN blocks direct CORS fetch.';
                        showSnackbar('Proxy corrupted image binary; update /api/proxy to forward arrayBuffer()', 'error');
                    } else {
                        exportProgressLabel.textContent = 'No valid photos could be fetched for this class.';
                        showSnackbar('No downloadable photos found', 'warning');
                    }
                    startExportBtn.disabled = false;
                    startExportBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 20px;">download</span><span>Retry ZIP</span>';
                    return;
                }

                exportProgressLabel.textContent = 'Compressing ZIP archive...';
                const zipBlob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, (meta) => {
                    exportProgressFill.style.width = `${Math.round(meta.percent)}%`;
                    exportProgressPercent.textContent = `${Math.round(meta.percent)}%`;
                });

                const downloadUrl = URL.createObjectURL(zipBlob);
                const anchor = document.createElement('a');
                anchor.href = downloadUrl;
                anchor.download = `SMJK_Katholik_Class_${sanitizeFilename(chosenClass)}_Photos.zip`;
                document.body.appendChild(anchor);
                anchor.click();
                anchor.remove();
                setTimeout(() => URL.revokeObjectURL(downloadUrl), 4000);

                exportProgressLabel.textContent = `Done! Packed ${downloaded} verified photos (${skipped} skipped).`;
                showSnackbar(`Downloaded ${downloaded} photos for Class ${chosenClass}`, 'folder_zip');
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    exportProgressLabel.textContent = 'Export failed. Please try again.';
                    showSnackbar('Error creating ZIP archive', 'error');
                }
            } finally {
                exportAbortController = null;
                startExportBtn.disabled = false;
                startExportBtn.innerHTML = '<span class="material-symbols-rounded" style="font-size: 20px;">download</span><span>Download ZIP</span>';
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateTabIndicator(document.querySelector('.tab-btn.active'));
        });
        loadDirectory('students', false);
        startPolling('students');
    </script>
